---
name: Shellcheck

on:
  pull_request:
    paths:
      - '**.sh'
      - '.github/workflows/shellcheck.yml'

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Plain bash scripts only. Role templates (*.sh.j2) are not valid shell
      # until Jinja renders them, and zsh files use a different syntax.
      # Severity warning: info and style findings are left to taste.
      - name: Run shellcheck on tracked shell scripts
        run: |
          set -euo pipefail
          git ls-files -z '*.sh' | xargs -0 --no-run-if-empty shellcheck --severity=warning
