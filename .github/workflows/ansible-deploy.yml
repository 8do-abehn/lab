---
name: Ansible Deploy (Manual)

on:
  workflow_dispatch:
    inputs:
      playbook:
        description: 'Playbook to run'
        required: true
        default: 'site.yml'
        type: choice
        options:
          - site.yml
          - netdata_install.yml
          - verify_nut.yml
      limit:
        description: 'Limit to specific hosts (optional)'
        required: false
        type: string
      tags:
        description: 'Only run plays/tasks with these tags, comma separated (optional). Currently defined: smart, backup, cloudflare'
        required: false
        type: string
      verbose:
        description: 'Run with -v. Off by default: -v prints full task results into a PUBLIC log. Only enable to debug, and check for secrets afterwards.'
        required: false
        default: false
        type: boolean

jobs:
  deploy:
    name: Deploy to Infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Ansible
        run: |
          pip install ansible

      - name: Setup Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519_behner
          chmod 600 ~/.ssh/id_ed25519_behner

      - name: Create vault password file
        run: |
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > /tmp/vault_pass

      - name: Run Ansible playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'False'
          # Inputs are passed through the environment rather than interpolated
          # into the script body. ${{ }} substitution happens before the shell
          # ever sees the line, so an input containing shell metacharacters
          # would otherwise run as code.
          INPUT_PLAYBOOK: ${{ inputs.playbook }}
          INPUT_LIMIT: ${{ inputs.limit }}
          INPUT_TAGS: ${{ inputs.tags }}
          INPUT_VERBOSE: ${{ inputs.verbose }}
        run: |
          set -euo pipefail
          cd ansible

          EXTRA_ARGS=()
          if [ -n "$INPUT_LIMIT" ]; then
            EXTRA_ARGS+=(--limit "$INPUT_LIMIT")
          fi
          if [ -n "$INPUT_TAGS" ]; then
            EXTRA_ARGS+=(--tags "$INPUT_TAGS")
          fi

          # -v prints the full result dict for every task. This repo is public
          # and Actions logs are world readable, so one task missing no_log
          # publishes whatever it returned. Run 34432844757 leaked a live
          # cloudflared tunnel token that way. Failures still report their own
          # error without it, so verbosity is opt-in for debugging only.
          if [ "$INPUT_VERBOSE" = "true" ]; then
            echo "::warning::Running with -v. Full task results will appear in this PUBLIC log; review it for secrets afterwards."
            EXTRA_ARGS+=(-v)
          fi

          echo "Running $INPUT_PLAYBOOK ${EXTRA_ARGS[*]:-(no limit or tags)}"

          ansible-playbook -i inventory/homelab.yml "$INPUT_PLAYBOOK" \
            --vault-password-file /tmp/vault_pass \
            "${EXTRA_ARGS[@]}"

      - name: Netdata fleet health check
        if: >-
          success() &&
          (github.event.inputs.playbook == 'netdata_install.yml' ||
           github.event.inputs.playbook == 'site.yml')
        env:
          NETDATA_API_TOKEN: ${{ secrets.NETDATA_API_TOKEN }}
        run: |
          set -euo pipefail

          SPACE="fdc5c86c-40e1-4c04-ba72-2c270dbcc2f2"
          ROOM="b9b8607a-73ca-4de7-b5ae-86c3c74766be"
          API_URL="https://app.netdata.cloud/api/v2/spaces/${SPACE}/rooms/${ROOM}/nodes"

          echo "Querying Netdata Cloud for node status..."
          RESPONSE=$(curl -sf -H "Authorization: Bearer ${NETDATA_API_TOKEN}" \
            -H "Accept: application/json" \
            "${API_URL}")

          # Parse node names and states
          NODES=$(echo "$RESPONSE" | jq -r '.[] | "\(.name)\t\(.state)"')

          # Print summary table
          echo ""
          echo "Node Health Summary"
          echo "===================="
          printf "%-25s %s\n" "NODE" "STATE"
          printf "%-25s %s\n" "----" "-----"
          echo "$NODES" | while IFS=$'\t' read -r name state; do
            printf "%-25s %s\n" "$name" "$state"
          done
          echo ""

          # Check for unreachable nodes
          UNREACHABLE=$(echo "$NODES" | grep -v "reachable$" || true)
          if [ -n "$UNREACHABLE" ]; then
            echo "::error::Unreachable nodes detected after deploy:"
            echo "$UNREACHABLE" | while IFS=$'\t' read -r name state; do
              echo "  - ${name}: ${state}"
            done
            exit 1
          fi

          TOTAL=$(echo "$NODES" | wc -l | tr -d ' ')
          echo "All ${TOTAL} nodes are reachable."

      - name: Clean up vault password
        if: always()
        run: |
          rm -f /tmp/vault_pass
