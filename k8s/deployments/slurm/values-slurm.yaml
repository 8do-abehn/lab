# Slurm Cluster Configuration for Homelab K3s
# Based on Slinky Project v0.4.1
# Customize as needed for your workloads

# Cluster name
clusterName: "homelab-hpc"

# Controller configuration
controller:
  slurmctld:
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "2"
        memory: "4Gi"

  # Enable persistence for controller state
  persistence:
    enabled: true
    storageClassName: "local-path"
    resources:
      requests:
        storage: 4Gi

  # Extra Slurm controller configuration
  extraConf: null

# REST API configuration
restapi:
  replicas: 1
  slurmrestd:
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1"
        memory: "2Gi"
  service:
    type: ClusterIP

# Prometheus exporter
slurm-exporter:
  enabled: true
  exporter:
    serviceMonitor:
      enabled: true

# Accounting - disabled for now (requires MariaDB setup)
accounting:
  enabled: false

# Login nodes
loginsets:
  # Main login node
  login:
    enabled: true
    replicas: 1
    login:
      image:
        repository: ghcr.io/slinkyproject/login
        tag: 25.05-ubuntu24.04
      resources:
        requests:
          cpu: "500m"
          memory: "1Gi"
        limits:
          cpu: "1"
          memory: "2Gi"
    # Minimal sssdConf for homelab (no LDAP integration)
    sssdConf: |
      [sssd]
      config_file_version = 2
      services = nss,pam
      domains = local

      [nss]
      filter_groups = root,slurm
      filter_users = root,slurm

      [pam]

      [domain/local]
      id_provider = files
    service:
      spec:
        type: ClusterIP
      port: 22
    podSpec:
      nodeSelector:
        kubernetes.io/os: linux

# Compute node sets
nodesets:
  # Debug partition - 2 worker nodes
  debug:
    enabled: true
    replicas: 2
    slurmd:
      image:
        repository: ghcr.io/slinkyproject/slurmd
        tag: 25.05-ubuntu24.04
      resources:
        requests:
          cpu: "500m"
          memory: "1Gi"
        limits:
          cpu: "2"
          memory: "4Gi"
    logfile:
      image:
        repository: docker.io/library/alpine
        tag: latest
    partition:
      enabled: true
      configMap:
        State: UP
        Default: YES
        MaxTime: UNLIMITED
    podSpec:
      nodeSelector:
        kubernetes.io/os: linux

# Note: Partitions are automatically created from nodesets
# No need for explicit partition configuration here
