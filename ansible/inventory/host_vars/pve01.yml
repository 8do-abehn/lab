---
proxmox_gpu_passthrough_enabled: true
# RTX 3080 (0b:00.0/.1) is shared by vm-rtb (702) and vm-awb (703), one VM at a time.
# Both attach it through the cluster PCI mapping rtx3080-pve01 (/etc/pve/mapping/pci.cfg,
# not managed here), which checks vendor/subsystem IDs so an address drift after a BIOS
# change refuses to start the VM instead of passing the wrong device (#532).
proxmox_gpu_vfio_ids: "10de:2206,10de:1aef"
proxmox_gpu_blacklist_drivers:
  - nouveau
  - nvidia
  - nvidiafb
  - nvidia_drm
proxmox_gpu_grub_extra: "amd_iommu=on iommu=pt video=vesafb:off video=efifb:off"

# Host-level watchdog for CephFS mounts inside LXCs on this node (#516). See
# roles/lxc_mount_watchdog for why this exists and runs here rather than
# inside the container.
lxc_watchdog_targets:
  - ctid: 3001
    name: jellyfin01
    mount_path: /mnt/library
