---
# Minecraft servers on mc02 (LXC 3005 on pve02, 32GB RAM)
#
# Switched from standard-skyblock + sky-void-additions to Skyblock
# Infinite. The old pair never shipped a 26.2 build on any channel, so
# they pinned these servers to 26.1.2; Skyblock Infinite 1.1.15 supports
# 26.2 and needs no companion datapack.
#
# LEVEL points at a fresh world directory rather than reusing "world".
# Skyblock Infinite changes world generation, so it only takes effect on
# a newly generated world. Pointing LEVEL at a new name leaves the old
# "world" directory untouched inside the same volume, so this is
# reversible: drop LEVEL and the previous islands come back. Pre-switch
# snapshots also live in /root/mc-pre-26.1.2/ on pve01 and pve03.
minecraft_servers:
  - name: sawyer-skyblock
    port: 25567
    memory: "4G"
    version: "26.3"
    motd: "Sawyer's SkyBlock"
    extra_env:
      MODRINTH_PROJECTS: "datapack:skyblock-infinite"
      LEVEL: "skyblock-infinite"

  - name: riley-skyblock
    port: 25568
    memory: "4G"
    version: "26.3"
    motd: "Riley's SkyBlock"
    extra_env:
      MODRINTH_PROJECTS: "datapack:skyblock-infinite"
      LEVEL: "skyblock-infinite"

  # Flat world with a village at spawn (every villager already has a job,
  # so trading works right away) and a woodland mansion full of illagers
  # and pillagers about 200 blocks east, in view after a short walk. The
  # sawyer-village datapack builds all of that once, on the world's first
  # boot.
  #
  # LEVEL picks the world folder. Earlier worlds stay in the volume, so
  # pointing LEVEL back at one restores it: "world" (mansion ~100 blocks
  # out), "village-far" (~1300), "village-400" and "village-600". Only the
  # owner tested those.
  #
  # The flat layers put the ground at y=64 instead of superflat's usual
  # y=-61, because mansions refuse to generate below y=60. The seed is
  # pinned because /place is seeded by the world: this one was tested to
  # give a normal plains village (seed "sawyer" gives the zombie variant).
  - name: sawyer-village
    port: 25569
    memory: "4G"
    version: "26.3"
    motd: "Sawyer's Village"
    seed: "sawyer-village"
    datapacks:
      - sawyer-village
    extra_env:
      LEVEL: "village-200"
      LEVEL_TYPE: "minecraft:flat"
      GENERATOR_SETTINGS: >-
        {"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:stone","height":124},{"block":"minecraft:dirt","height":3},{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains","structure_overrides":[]}
