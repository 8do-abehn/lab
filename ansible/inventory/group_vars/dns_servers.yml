---
tailscale_auth_key: "{{ vault_tailscale_dns_auth_key | default('') }}"
tailscale_tags: "tag:dns"
tailscale_accept_dns: false
tailscale_advertise_routes:
  - "10.150.10.0/24"
  - "10.150.60.0/24"
  - "10.150.65.0/24"
  - "10.150.70.0/24"

adguard_home_tailscale_service: "svc:dns"
adguard_home_password: "{{ vault_adguard_password }}"

# The tailnet zone goes to MagicDNS so default-LAN devices resolve Tailscale
# Service names (jellyfin.<tailnet>, home.<tailnet>, ...) to their 100.x
# addresses. They then reach them through the router's 100.64.0.0/10 static
# route to dns01, the subnet router, so that traffic crosses WireGuard at MTU
# 1280. That is the price of one name everywhere with a valid certificate.
#
# The rewrites below still win over this forward, so LAN-resident hosts asked
# for by host name (jellyfin01.<tailnet>) keep resolving to their LAN IP and
# stay off the subnet router. That was the reason this list used to be empty.
# See feedback_tailscale_magicdns_lan.md.
#
# 100.100.100.100 answers on any node running tailscaled, whatever its
# --accept-dns setting, so dns01 and dns02 can both forward to it.
adguard_home_conditional_forwards:
  - domain: "{{ tailnet_domain }}"
    upstream: 100.100.100.100

# LAN-resident hosts that should resolve to LAN IPs even via Tailscale FQDN.
adguard_home_rewrites:
  - domain: jellyfin01
    answer: 10.150.70.12
  - domain: jellyfin01.taile975f.ts.net
    answer: 10.150.70.12
  - domain: immich01
    answer: 10.150.70.15
  - domain: immich01.taile975f.ts.net
    answer: 10.150.70.15

# Service IDs blocked at DNS level (AdGuard's "Blocked services" presets).
# Reconciled idempotently — order doesn't matter, duplicates ignored.
adguard_home_blocked_services:
  - 4chan
  - 9gag
  - aliexpress
  - betano
  - betfair
  - betway
  - blaze
  - box
  - clubhouse
  - discord
  - dropbox
  - flickr
  - imgur
  - instagram
  - kakaotalk
  - kik
  - line
  - linkedin
  - mail_ru
  - mastodon
  - max
  - olvid
  - onlyfans
  - plenty_of_fish
  - reddit
  - shein
  - signal
  - skype
  - snapchat
