---
tailscale_auth_key: "{{ vault_tailscale_dns_auth_key }}"
tailscale_tags: "tag:dns"
tailscale_accept_dns: false
tailscale_advertise_routes:
  - "10.150.10.0/24"
  - "10.150.60.0/24"
  - "10.150.65.0/24"
  - "10.150.70.0/24"

adguard_home_tailscale_service: "svc:dns"

# Conditional forwarders intentionally empty: forwarding *.ts.net to MagicDNS
# defeats AdGuard's authority for LAN-resident hosts and forces traffic through
# the Tailscale subnet router at MTU 1280. See feedback_tailscale_magicdns_lan.md.
adguard_home_conditional_forwards: []

# LAN-resident hosts that should resolve to LAN IPs even via Tailscale FQDN.
adguard_home_rewrites:
  - domain: jellyfin01
    answer: 10.150.70.12
  - domain: jellyfin01.taile975f.ts.net
    answer: 10.150.70.12

# Service IDs blocked at DNS level (AdGuard's "Blocked services" presets).
# Reconciled idempotently — order doesn't matter, duplicates ignored.
adguard_home_blocked_services:
  - 4chan
  - 9gag
  - aliexpress
  - betano
  - betfair
  - betway
  - blaze
  - box
  - clubhouse
  - discord
  - dropbox
  - flickr
  - imgur
  - instagram
  - kakaotalk
  - kik
  - line
  - linkedin
  - mail_ru
  - mastodon
