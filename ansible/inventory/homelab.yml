---
# Homelab Infrastructure Inventory
# Managed by Ansible — see ansible/README.md for usage

all:
  children:
    # Parent group — all Proxmox hosts (used by site.yml)
    proxmox:
      children:
        proxmox_pve0x:

    # NUT / UPS monitoring. Re-cabled to the new cluster 2026-09-08.
    # The APC SMART-UPS 2200 plugs into pve01 through an FTDI USB-to-serial adapter
    # and an APC 940-0024C smart-signalling cable (pve01-03 have no onboard UART).
    # Shared settings live in inventory/group_vars/nut.yml.
    nut:
      children:
        # Host the UPS is physically cabled to (runs the driver and upsd)
        nut_server:
          hosts:
            pve01:

        # Everything else monitors upsd on pve01 over the network.
        #
        # pve02 and pve03 are commented out deliberately, see #487. pve01's UPS
        # cannot be trusted to report its own runtime: the pack was swapped to
        # LiFePO4 on 01/24/25 but the UPS dates from 2000 and models capacity
        # for lead acid, so its estimate is quantised to 60s steps and swings
        # 4x on an 8% load change. Enrolling netclients now would arm shutdown
        # monitoring cluster wide against that.
        #
        # They were left in the group but undeployed, which made any unscoped
        # `site.yml` run enrol them silently. That is a poor thing to rely on
        # remembering, so the state is explicit here instead.
        #
        # Uncomment once #487 has measured real runtime and set thresholds
        # from it.
        nut_netclients:
          hosts: {}
          # pve02:
          # pve03:

    # Proxmox New Cluster (3-node, Proxmox 9, Ceph)
    # Management VLAN 60: 10.150.60.0/24
    # Storage VLAN 65: 10.150.65.0/24
    # Guest VLAN 70: 10.150.70.0/24
    proxmox_pve0x:
      hosts:
        pve01:  # Ryzen 9 5900X, 128GB, 2x RX 570, Intel I225-V 2.5G
        pve02:  # Ryzen 9 5900X, 64GB, 1x RTX 3080 Ti, Aquantia 10G + Intel I225-V 2.5G
        pve03:  # Ryzen 9 5900X, 128GB, 2x RTX 3080, Intel I225-V 2.5G

    # DNS Servers (VLAN 60, AdGuard Home + Tailscale subnet router)
    dns_servers:
      hosts:
        dns01:  # LXC 3002 on pve01, AdGuard Home + Tailscale subnet router
          ansible_user: root
        dns02:  # LXC 3012 on pve03, AdGuard Home secondary (HA pair with dns01)
          ansible_user: root
          ansible_host: 100.125.245.12

    # mem0 Servers (VLAN 70, AI memory stack)
    mem0_servers:
      hosts:
        mem01:  # LXC 3003 on pve02, OpenMemory + Ollama + Open WebUI
          ansible_user: root
          ansible_host: 100.85.177.56

    # Media Servers (VLAN 70, new cluster LXCs)
    media_servers:
      hosts:
        jellyfin01:  # LXC 3001 on pve01, CephFS media at /mnt/library
          ansible_user: root

    # Immich Photos (VLAN 70, new cluster LXC)
    immich_servers:
      hosts:
        immich01:  # LXC 3013 on pve03, 8GB RAM -- Immich photo library
          ansible_user: root
          # No ansible_host: registered on the tailnet 2026-09-19 as tag:immich,
          # so MagicDNS resolves it like every other host. A raw IP here would
          # bypass Tailscale SSH, which is how CI authenticates, and CI has no
          # key on any host.

    # Minecraft Servers (Docker in LXCs). All three are running again as of
    # 2026-09-12. mc03 stays commented out until its config is reviewed.
    minecraft_servers:
      hosts:
        mc01:  # LXC 3004 on pve03, 32GB RAM -- survival, creative, oneblock
          ansible_user: root
        mc02:  # LXC 3005 on pve01, 32GB RAM -- sawyer-skyblock, riley-skyblock
          ansible_user: root
        # mc03:  # LXC 3006 on pve02, 32GB RAM -- cobblemon
        #   ansible_user: root

    # SLURM Cluster (archived - VMs deleted 2026-01-30)
    # See ansible/archive/slurm-cluster/

    # Cloudflare Tunnel (hosts with cloudflared tunnels)
    cloudflare_tunnel:
      hosts:
        jellyfin01:

    # Cloudflare IP Registration (hosts with IP registration Worker)
    cloudflare_ip_registration:
      hosts:
        jellyfin01:

    # Backup Clients (hosts that back up to pi-burg)
    backup_clients:
      hosts:
        jellyfin01:
          backup_server_host: 100.83.251.53  # pi-burg Tailscale IP (MagicDNS broken in LXC)
          # Designated prune host. Prune reclaims space for the whole shared repo,
          # so exactly one client should run it -- see backup_client defaults.
          backup_prune_enabled: true
          backup_paths:
            - /mnt/library
            - /var/lib/jellyfin
            - /etc/jellyfin
          # /mnt/library is CephFS via ceph-fuse. If it fails to mount the
          # directory is still there, just empty, so the backup must abort
          # rather than snapshot nothing and report success.
          backup_required_mounts:
            - /mnt/library
          backup_excludes:
            - "*.tmp"
            - "lost+found"
            - "tmp/"
            - "cache/"
            - "transcodes/"
            - "log/"
            - "*.log*"

        # Added once pi-burg moved to eth0 (#478). The concurrency concern from
        # #479 is resolved: #483 serializes every restic job against this shared
        # repo behind a common flock, so immich01 and jellyfin01 queue rather
        # than contend.
        immich01:
          backup_server_host: 100.83.251.53  # pi-burg Tailscale IP (MagicDNS broken in LXC)

          # Immich dumps its own Postgres database to upload/backups nightly at
          # 02:30 (3 retained, ~18 MB each), so no pre-backup hook is needed.
          # But run AFTER that, or each snapshot carries the previous night's
          # dump and the metadata trails the photos by a day. Photos without
          # albums, faces and metadata are not a restore.
          backup_cron_hour: "3"

          backup_paths:
            - /opt/immich/upload

            # Immich's config lives OUTSIDE UPLOAD_LOCATION and holds
            # DB_PASSWORD. The nightly dump in upload/backups is a pg_dump of
            # the database, which does not carry the role that owns it, so
            # without this file a restore yields 497 GB of photos and a
            # database nothing can connect to.
            - /opt/immich/.env

            # How Immich is wired on this host (user, working dir, start
            # script). A few KB, and it saves reconstructing the unit files
            # from memory during a rebuild.
            - /etc/systemd/system/immich-ml.service
            - /etc/systemd/system/immich-web.service

          # /opt/immich/upload is a Ceph RBD mount. If it fails to mount the
          # directory is still there but empty, which is the silent-success
          # failure #457 describes. Abort instead.
          backup_required_mounts:
            - /opt/immich/upload

          backup_excludes:
            - "*.tmp"
            - "lost+found"
            - "thumbs/"          # 1.2 GB, regenerated from originals
            - "encoded-video/"   # 521 MB, regenerated from originals

          # pi-burg is offsite on a domestic link someone else has to live with.
          # Clear this temporarily for the initial seed while the Pi is on the
          # local network, or ~217 GB at 40 Mbit/s takes about twelve hours.
          backup_bandwidth_limit: 5120

        # /staging (608 GB) is deliberately NOT backed up. It is the raw Google
        # Photos export being imported into Immich, so once imported it is
        # duplicated under /opt/immich/upload. Backing up both would roughly
        # double the repo for no additional recoverability.
        #
        # Do not delete anything from Google Photos until immich01 has a
        # verified snapshot. As of this commit it has none.

        # AdGuard Home configuration and custom filter state are small and
        # restoreable from the application directory. Query logs and stats are
        # intentionally excluded: they are high-churn operational data, not
        # part of the DNS service's recovery state.
        dns01:
          backup_server_host: 100.83.251.53  # pi-burg Tailscale IP (MagicDNS broken in LXC)
          backup_paths:
            - /opt/AdGuardHome
          backup_excludes:
            - "data/querylog.json"
            - "data/querylog.json.*"
            - "data/stats.db"

        dns02:
          backup_server_host: 100.83.251.53  # pi-burg Tailscale IP (MagicDNS broken in LXC)
          backup_paths:
            - /opt/AdGuardHome
          backup_excludes:
            - "data/querylog.json"
            - "data/querylog.json.*"
            - "data/stats.db"

    # Backup Servers
    backup_servers:
      hosts:
        pi-burg:
          ansible_user: root
          backup_disk_uuid: ffbe8e24-8713-4c30-8500-1474d7adc397
          backup_mount_point: /mnt/backup

