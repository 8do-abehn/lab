---
# Homelab Infrastructure Inventory
# Managed by Ansible — see ansible/README.md for usage

all:
  children:
    # Parent group — all Proxmox hosts (used by site.yml)
    proxmox:
      children:
        proxmox_pve0x:

    # NUT / UPS monitoring. Re-cabled to the new cluster 2026-09-08.
    # The APC SMART-UPS 2200 plugs into pve01 through an FTDI USB-to-serial adapter
    # and an APC 940-0024C smart-signalling cable (pve01-03 have no onboard UART).
    # Shared settings live in inventory/group_vars/nut.yml.
    nut:
      children:
        # Host the UPS is physically cabled to (runs the driver and upsd)
        nut_server:
          hosts:
            pve01:

        # Everything else monitors upsd on pve01 over the network.
        #
        # pve02, pve03 and the network gear are ALL on this UPS's battery
        # outlets. That makes enrolment mandatory, not optional: since #538,
        # FSD works and pve01's shutdown hook tells the UPS to cut its output
        # ~20s after pve01 halts. Any host on the UPS that is not a netclient
        # gets no warning and loses power hard, Ceph included.
        #
        # #497 un-enrolled them because shutdown then hinged on the UPS's own
        # runtime estimate, which is fiction for this LiFePO4 pack. #538 took
        # that out of the decision (ignorelb; triggers are now 60s on battery
        # or charge < 50), so that reason no longer applies. Thresholds are
        # still provisional pending #487.
        nut_netclients:
          hosts:
            pve02:
            pve03:

    # Proxmox New Cluster (3-node, Proxmox 9, Ceph)
    # Management VLAN 60: 10.150.60.0/24
    # Storage VLAN 65: 10.150.65.0/24
    # Guest VLAN 70: 10.150.70.0/24
    proxmox_pve0x:
      hosts:
        pve01:  # Ryzen 9 5900X, 128GB, 1x RTX 3080 + 1x RX 570, Intel I225-V 2.5G
        pve02:  # Ryzen 9 5900X, 64GB, 1x RTX 3080 Ti + 1x RX 570, Aquantia 10G + Intel I225-V 2.5G
        pve03:  # Ryzen 9 5900X, 128GB, 1x RTX 3080 + 1x RX 570, Intel I225-V 2.5G

    # DNS Servers (VLAN 60, AdGuard Home + Tailscale subnet router)
    dns_servers:
      hosts:
        dns01:  # LXC 3002 on pve01, AdGuard Home + Tailscale subnet router
          ansible_user: root
        dns02:  # LXC 3012 on pve03, AdGuard Home secondary (HA pair with dns01)
          ansible_user: root
          ansible_host: 100.125.245.12

    # mem0 Servers (VLAN 70, AI memory stack)
    mem0_servers:
      hosts:
        mem01:  # LXC 3003 on pve02, OpenMemory + Ollama + Open WebUI
          ansible_user: root
          ansible_host: 100.85.177.56

    # Media Servers (VLAN 70, new cluster LXCs)
    media_servers:
      hosts:
        jellyfin01:  # LXC 3001 on pve01, CephFS media at /mnt/library (kernel bind mount, #591)
          ansible_user: root

    # Immich Photos (VLAN 70, new cluster LXC)
    immich_servers:
      hosts:
        immich01:  # LXC 3013 on pve03, 8GB RAM -- Immich photo library
          ansible_user: root
          # No ansible_host: registered on the tailnet 2026-09-19 as tag:immich,
          # so MagicDNS resolves it like every other host. A raw IP here would
          # bypass Tailscale SSH, which is how CI authenticates, and CI has no
          # key on any host.

    # UniFi Network controller (VLAN 60). Only managed for Tailscale tagging
    # and restic backups (#549); the controller itself is installed by hand.
    unifi_servers:
      hosts:
        unifi:  # LXC 3011 on pve03, UniFi Network controller for the APs and switches
          ansible_user: root
          # No ansible_host, same reason as immich01: MagicDNS name, so CI goes
          # through Tailscale SSH.

    # riplab encoders (VLAN 60). HandBrake x265 built from source, works the
    # queue in cephfs-hdd/riplab (bind-mounted at /riplab). See #548.
    encoders:
      hosts:
        encode01:  # LXC 3015 on pve02, 24 cores at cpuunits 10 -- riplab x265 encoder
          ansible_user: root
          # No ansible_host: MagicDNS name, so CI goes through Tailscale SSH.

    # Not managed by Ansible: dropbox, LXC 3102 on pve01 (VLAN 70, DHCP).
    # Drop point for files from the client LAN. Bind mounts the Jellyfin
    # library and cephfs-hdd/riplab. Not on the tailnet, so CI cannot reach it;
    # listed here only so it is not forgotten. Pinned by the HA rule
    # dropbox-bindmount-pin (#591). See #550, #600.

    # Claude Code host (VLAN 60). Always-on sessions steered from the phone
    # with Remote Control. No outbound SSH to other hosts yet. See #575.
    claude_hosts:
      hosts:
        claude01:  # LXC 3016 on pve03 -- Claude Code sessions in tmux, runs as user adambehn (no sudo)
          ansible_user: root
          # No ansible_host: MagicDNS name, so CI goes through Tailscale SSH.

    # Minecraft Servers (Docker in LXCs). All three are running again as of
    # 2026-09-12. mc03 stays commented out until its config is reviewed.
    # Node placement is HA-managed and drifts; these are as of 2026-10-04.
    minecraft_servers:
      hosts:
        mc01:  # LXC 3004 on pve01, 32GB RAM -- survival, creative, oneblock
          ansible_user: root
        mc02:  # LXC 3005 on pve02, 32GB RAM -- sawyer-skyblock, riley-skyblock
          ansible_user: root
        # mc03:  # LXC 3006 on pve03, 32GB RAM -- cobblemon
        #   ansible_user: root

    # SLURM Cluster (archived - VMs deleted 2026-01-30)
    # See ansible/archive/slurm-cluster/

    # Cloudflare Tunnel (hosts with cloudflared tunnels)
    cloudflare_tunnel:
      hosts:
        jellyfin01:

    # Cloudflare IP Registration (hosts with IP registration Worker)
    cloudflare_ip_registration:
      hosts:
        jellyfin01:

    # Backup Clients (hosts that back up to pi-burg)
    backup_clients:
      hosts:
        jellyfin01:
          backup_server_host: 100.83.251.53  # pi-burg Tailscale IP (MagicDNS broken in LXC)
          # Small backups first, the big one last. jellyfin01 is usually done in
          # minutes, but when a batch of new media lands it uploads for hours
          # (~2 MB/s to pi-burg: 28.5 GB took 4.5h+ on 2026-10-08). At 02:00 it
          # ran first and held the shared repo lock while unifi (02:15) and
          # immich01 (03:00) tried to apply retention, which then failed. Their
          # snapshots were saved either way.
          #
          # Night order (Central): Immich DB dump 00:30, immich01 00:45, unifi
          # 01:15, jellyfin01 01:30. Moving Immich's own dump earlier (an Immich
          # setting, see immich01 below) is what lets jellyfin01 start this early
          # while still running last.
          backup_cron_hour: "1"
          backup_cron_minute: "30"
          # Designated prune host. Prune reclaims space for the whole shared repo,
          # so exactly one client should run it -- see backup_client defaults.
          backup_prune_enabled: true
          # Designated checker as well: `restic check` covers the whole shared
          # repo, so it runs from one client rather than all four.
          backup_check_enabled: true
          backup_paths:
            - /mnt/library
            - /var/lib/jellyfin
            - /etc/jellyfin
          # /mnt/library is a CephFS bind mount from the pve host (#591). If it fails to mount the
          # directory is still there, just empty, so the backup must abort
          # rather than snapshot nothing and report success.
          backup_required_mounts:
            - /mnt/library
          backup_excludes:
            - "*.tmp"
            - "lost+found"
            - "tmp/"
            - "cache/"
            - "transcodes/"
            - "log/"
            - "*.log*"

        # Added once pi-burg moved to eth0 (#478). The concurrency concern from
        # #483's flock only serializes restic jobs on ONE host; it does not stop
        # immich01 and jellyfin01 overlapping on the shared repo. restic's own
        # repo locks plus --retry-lock handle that, and the schedule keeps them
        # apart: immich01 at 00:45, unifi at 01:15, jellyfin01 at 01:30.
        immich01:
          backup_server_host: 100.83.251.53  # pi-burg Tailscale IP (MagicDNS broken in LXC)

          # Immich dumps its own Postgres database to upload/backups nightly at
          # 00:30 (3 retained, ~375 MB each, done in under a minute), so no
          # pre-backup hook is needed. That time is NOT managed here: it is
          # Immich's own setting (Administration > Settings > Backup, stored as
          # backup.database.cronExpression = "30 0 * * *"; was "30 2 * * *"
          # until 2026-10-09). Change both together.
          # But run AFTER that, or each snapshot carries the previous night's
          # dump and the metadata trails the photos by a day. Photos without
          # albums, faces and metadata are not a restore.
          # 00:45: fifteen minutes after the dump starts, which has finished in
          # under a minute every night checked (xx:30:00 to xx:30:49). This
          # backup itself has taken up to 12.7 minutes (2026-10-05), so it is
          # done well before unifi at 01:15 and jellyfin01 at 01:30.
          backup_cron_hour: "0"
          backup_cron_minute: "45"

          backup_paths:
            - /opt/immich/upload

            # Immich's config lives OUTSIDE UPLOAD_LOCATION and holds
            # DB_PASSWORD. The nightly dump in upload/backups is a pg_dump of
            # the database, which does not carry the role that owns it, so
            # without this file a restore yields 497 GB of photos and a
            # database nothing can connect to.
            - /opt/immich/.env

            # How Immich is wired on this host (user, working dir, start
            # script). A few KB, and it saves reconstructing the unit files
            # from memory during a rebuild.
            - /etc/systemd/system/immich-ml.service
            - /etc/systemd/system/immich-web.service

          # /opt/immich/upload is a Ceph RBD mount. If it fails to mount the
          # directory is still there but empty, which is the silent-success
          # failure #457 describes. Abort instead.
          backup_required_mounts:
            - /opt/immich/upload

          backup_excludes:
            - "*.tmp"
            - "lost+found"
            - "thumbs/"          # 1.2 GB, regenerated from originals
            - "encoded-video/"   # 521 MB, regenerated from originals

          # pi-burg is offsite on a domestic link someone else has to live with.
          # Clear this temporarily for the initial seed while the Pi is on the
          # local network, or ~217 GB at 40 Mbit/s takes about twelve hours.
          backup_bandwidth_limit: 5120

        # /staging (608 GB) is deliberately NOT backed up. It is the raw Google
        # Photos export being imported into Immich, so once imported it is
        # duplicated under /opt/immich/upload. Backing up both would roughly
        # double the repo for no additional recoverability.
        #
        # Do not delete anything from Google Photos until immich01 has a
        # verified snapshot. As of this commit it has none.

        # AdGuard Home configuration and custom filter state are small and
        # restoreable from the application directory. Query logs and stats are
        # intentionally excluded: they are high-churn operational data, not
        # part of the DNS service's recovery state.
        # dns01 and dns02 share this same repo (backup_server_repo_path
        # defaults identically for every client). restic forget takes an
        # exclusive repo lock even without --prune, so overlapping runs fail
        # with "repository is already locked" (first caught 2026-09-24).
        # dns01 and dns02 are staggered by minute against each other: each
        # run is a few seconds for one small config file.
        #
        # They run at 21:xx, not 02:xx, on purpose. Until 2026-10-05 these
        # two LXCs were on UTC, so their "02:05" cron actually fired at 21:05
        # Central and never met jellyfin01's 02:00 run. Now that every host
        # is on America/Chicago, 21 keeps them at that same real time, clear
        # of jellyfin01, which can run for hours when new media lands.
        dns01:
          backup_server_host: 100.83.251.53  # pi-burg Tailscale IP (MagicDNS broken in LXC)
          backup_cron_hour: "21"
          backup_cron_minute: "5"
          # Config only. /opt/AdGuardHome is ~946MB on dns01, nearly all of it
          # data/ query logs and statistics: disposable, rewritten constantly,
          # and so they churn the repo every night. AdGuardHome.yaml is 6.7KB
          # and holds user_rules, clients and filters, the parts the
          # adguard_home role does not fully reproduce.
          backup_paths:
            - /opt/AdGuardHome/AdGuardHome.yaml
          backup_excludes:
            - "data/querylog.json"
            - "data/querylog.json.*"
            - "data/stats.db"

        dns02:
          backup_server_host: 100.83.251.53  # pi-burg Tailscale IP (MagicDNS broken in LXC)
          backup_cron_hour: "21"
          backup_cron_minute: "10"
          # Config only. /opt/AdGuardHome is ~946MB on dns01, nearly all of it
          # data/ query logs and statistics: disposable, rewritten constantly,
          # and so they churn the repo every night. AdGuardHome.yaml is 6.7KB
          # and holds user_rules, clients and filters, the parts the
          # adguard_home role does not fully reproduce.
          backup_paths:
            - /opt/AdGuardHome/AdGuardHome.yaml
          backup_excludes:
            - "data/querylog.json"
            - "data/querylog.json.*"
            - "data/stats.db"

        # The controller's own weekly .unf autobackups are a complete restore
        # (devices, sites, WLANs, adoption state) at ~40 KB each, so back up
        # just those rather than the whole LXC. Restore = fresh controller +
        # upload one .unf in the setup wizard. Until #549 the only copy was a
        # migration-era vzdump.
        unifi:
          backup_server_host: 100.83.251.53  # pi-burg Tailscale IP, same as the other clients
          # 01:15: after immich01 (00:45), before jellyfin01 (01:30).
          backup_cron_hour: "1"
          backup_cron_minute: "15"
          backup_paths:
            - /var/lib/unifi/backup/autobackup

    # Backup Servers
    backup_servers:
      hosts:
        pi-burg:
          ansible_user: root
          backup_disk_uuid: ffbe8e24-8713-4c30-8500-1474d7adc397
          backup_mount_point: /mnt/backup

