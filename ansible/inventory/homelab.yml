---
# Homelab Infrastructure Inventory
# Managed by Ansible — see ansible/README.md for usage

all:
  children:
    # Parent group — all Proxmox hosts (used by site.yml)
    proxmox:
      children:
        proxmox_pve0x:

    # NUT / UPS groups — empty since the legacy cluster was retired 2026-09-05.
    # The APC SMART-UPS 2200 has not been re-cabled to the new cluster yet; doing so
    # needs a USB-to-serial adapter plus an APC 940-0024C cable (pve01-03 have no UART).
    # Populate nut_server with the host the UPS plugs into, nut_netclients with the rest.
    nut_server:
      hosts: {}

    nut_netclients:
      hosts: {}

    # Proxmox New Cluster (3-node, Proxmox 9, Ceph)
    # Management VLAN 60: 10.150.60.0/24
    # Storage VLAN 65: 10.150.65.0/24
    # Guest VLAN 70: 10.150.70.0/24
    proxmox_pve0x:
      hosts:
        pve01:  # Ryzen 9 5900X, 128GB, 2x RX 570, Intel I225-V 2.5G
        pve02:  # Ryzen 9 5900X, 64GB, 1x RTX 3080 Ti, Aquantia 10G + Intel I225-V 2.5G
        pve03:  # Ryzen 9 5900X, 128GB, 2x RTX 3080, Intel I225-V 2.5G

    # DNS Servers (VLAN 60, AdGuard Home + Tailscale subnet router)
    dns_servers:
      hosts:
        dns01:  # LXC 3002 on pve01, AdGuard Home + Tailscale subnet router
          ansible_user: root
        dns02:  # LXC 3012 on pve03, AdGuard Home secondary (HA pair with dns01)
          ansible_user: root
          ansible_host: 100.125.245.12

    # mem0 Servers (VLAN 70, AI memory stack)
    mem0_servers:
      hosts:
        mem01:  # LXC 3003 on pve02, OpenMemory + Ollama + Open WebUI
          ansible_user: root
          ansible_host: 100.85.177.56

    # Media Servers (VLAN 70, new cluster LXCs)
    media_servers:
      hosts:
        jellyfin01:  # LXC 3001 on pve01, CephFS media at /mnt/library
          ansible_user: root

    # Immich Photos (VLAN 70, new cluster LXC)
    immich_servers:
      hosts:
        immich01:  # LXC 3013 on pve03, 8GB RAM -- Immich photo library
          ansible_user: root
          # Pinned to the LAN address: this host was built by the community
          # script and is not on the tailnet until the tailscale role runs, so
          # there is no MagicDNS name to resolve yet.
          ansible_host: 10.150.70.15

    # Minecraft Servers (Docker in LXCs). All three are running again as of
    # 2026-09-12. mc03 stays commented out until its config is reviewed.
    minecraft_servers:
      hosts:
        mc01:  # LXC 3004 on pve03, 32GB RAM -- survival, creative, oneblock
          ansible_user: root
        mc02:  # LXC 3005 on pve01, 32GB RAM -- sawyer-skyblock, riley-skyblock
          ansible_user: root
        # mc03:  # LXC 3006 on pve02, 32GB RAM -- cobblemon
        #   ansible_user: root

    # SLURM Cluster (archived - VMs deleted 2026-01-30)
    # See ansible/archive/slurm-cluster/

    # Cloudflare Tunnel (hosts with cloudflared tunnels)
    cloudflare_tunnel:
      hosts:
        jellyfin01:

    # Cloudflare IP Registration (hosts with IP registration Worker)
    cloudflare_ip_registration:
      hosts:
        jellyfin01:

    # Backup Clients (hosts that back up to pi-burg)
    backup_clients:
      hosts:
        jellyfin01:
          backup_server_host: 100.83.251.53  # pi-burg Tailscale IP (MagicDNS broken in LXC)
          backup_paths:
            - /mnt/library
            - /var/lib/jellyfin
            - /etc/jellyfin
          # /mnt/library is CephFS via ceph-fuse. If it fails to mount the
          # directory is still there, just empty, so the backup must abort
          # rather than snapshot nothing and report success.
          backup_required_mounts:
            - /mnt/library
          backup_excludes:
            - "*.tmp"
            - "lost+found"
            - "tmp/"
            - "cache/"
            - "transcodes/"
            - "log/"
            - "*.log*"

        immich01:
          backup_server_host: 100.83.251.53  # pi-burg Tailscale IP (MagicDNS broken in LXC)
          backup_paths:
            - /opt/immich/upload
            # Carries the installer-generated DB password and lives on the
            # rootfs, outside the library volume. Without it a restore is
            # painful. The restic repo is encrypted, so this is safe to include.
            - /opt/immich/.env
          # /opt/immich/upload is a separate RBD volume. Immich refuses to start
          # if it is unmounted, but the backup must not snapshot an empty tree
          # if it somehow runs anyway.
          backup_required_mounts:
            - /opt/immich/upload
          # thumbs/ and encoded-video/ are regenerable and large; Immich rebuilds
          # them from the originals. Keeping them out of a shared repo matters.
          backup_excludes:
            - "*.tmp"
            - "lost+found"
            - "tmp/"
            - "thumbs/"
            - "encoded-video/"
          # Staggered off jellyfin01's 02:00 so the two clients never contend for
          # the repo lock, and late enough to pick up Immich's 02:30 database dump.
          backup_cron_hour: "3"
          backup_check_cron_hour: "7"

    # Backup Servers
    backup_servers:
      hosts:
        pi-burg:
          ansible_user: root
          backup_disk_uuid: ffbe8e24-8713-4c30-8500-1474d7adc397
          backup_mount_point: /mnt/backup

