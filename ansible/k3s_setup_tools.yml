---
# Install basic tools on k3s cluster nodes
- name: Install vim and git on k3s cluster
  hosts: k3s_cluster
  become: true

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install vim and git
      ansible.builtin.apt:
        name:
          - vim
          - git
        state: present
