---
# Backup infrastructure setup
# Configures Pi as backup server and Jellyfin as backup client

- name: Configure backup server (Pi)
  hosts: backup_servers
  become: true
  vars_files:
    - vault.yml
  roles:
    - tailscale
    - backup_server

- name: Configure backup client
  hosts: backup_clients
  become: true
  vars_files:
    - vault.yml
  roles:
    - backup_client
