[defaults]
inventory = inventory/homelab.yml

# Run tasks on more hosts in parallel (default: 5)
forks = 20

# Only gather facts when needed, cache them
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 86400

# Quieter output
display_skipped_hosts = False

[ssh_connection]
# Reduce SSH round trips per task
pipelining = True

# Reuse SSH connections
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no

# Retry a command whose ssh exits 255 (connection-level failure) before marking the host
# UNREACHABLE. Tailscale SSH re-checks every open connection on each netmap update and
# closes some live ones ("session no longer valid per new SSH policy"), which Ansible
# reported as "Data could not be sent to remote host" mid-run. A retry opens a fresh
# connection. See #599.
retries = 3
