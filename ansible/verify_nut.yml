---
- name: Verify NUT UPS monitoring setup
  hosts: proxmox
  become: true
  gather_facts: false

  tasks:
    - name: Check if NUT is installed
      ansible.builtin.command: which upsc
      register: upsc_check
      failed_when: false
      changed_when: false

    - name: Determine if this is server or client
      ansible.builtin.shell: set -o pipefail; grep "^MODE=" /etc/nut/nut.conf | cut -d= -f2
      args:
        executable: /bin/bash
      register: nut_mode_check
      changed_when: false

    - name: Query UPS status
      ansible.builtin.command: upsc myups@10.150.10.44
      register: ups_status
      failed_when: false
      changed_when: false

    - name: Check nut-monitor service
      ansible.builtin.systemd:
        name: nut-monitor
        state: started
      check_mode: true
      register: monitor_service
      failed_when: false

    - name: Check nut-server service (servers only)
      ansible.builtin.systemd:
        name: nut-server
        state: started
      check_mode: true
      register: server_service
      failed_when: false
      when: nut_mode_check.stdout == "standalone"

    - name: Display verification results
      ansible.builtin.debug:
        msg: |
          Host: {{ inventory_hostname }}
          NUT Installed: {{ 'Yes' if upsc_check.rc == 0 else 'No' }}
          Mode: {{ nut_mode_check.stdout }}
          UPS Connection: {{ 'OK' if ups_status.rc == 0 else 'FAILED' }}
          Monitor Service: {{ 'Running' if monitor_service.status.ActiveState == 'active' else 'Not Running' }}
          {% if nut_mode_check.stdout == "standalone" %}
          Server Service: {{ 'Running' if server_service.status.ActiveState == 'active' else 'Not Running' }}
          {% endif %}
          UPS Status: {{ ups_status.stdout_lines | select('search', 'ups.status') | first if ups_status.rc == 0 else 'N/A' }}
          Battery Charge: {{ ups_status.stdout_lines | select('search', 'battery.charge') | first if ups_status.rc == 0 else 'N/A' }}
          UPS Load: {{ ups_status.stdout_lines | select('search', 'ups.load') | first if ups_status.rc == 0 else 'N/A' }}

    - name: Set verification status
      ansible.builtin.set_fact:
        nut_healthy: "{{ upsc_check.rc == 0 and ups_status.rc == 0 and monitor_service.status.ActiveState == 'active' }}"

- name: Summary
  hosts: proxmox
  gather_facts: false
  tasks:
    - name: Show healthy hosts
      ansible.builtin.debug:
        msg: "✓ {{ inventory_hostname }} - NUT monitoring is healthy"
      when: nut_healthy | default(false)

    - name: Show unhealthy hosts
      ansible.builtin.debug:
        msg: "✗ {{ inventory_hostname }} - NUT monitoring has issues"
      when: not (nut_healthy | default(false))
