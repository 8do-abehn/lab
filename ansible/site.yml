---
# Main site playbook - applies roles to all infrastructure
- name: Configure base Proxmox settings
  hosts: proxmox
  become: yes
  roles:
    - proxmox

- name: Setup Tailscale on all hosts
  hosts: proxmox:k3s_cluster
  become: yes
  vars_files:
    - vault.yml
  roles:
    - tailscale

- name: Configure NUT UPS (auto-detect server/client)
  hosts: proxmox
  become: yes
  vars_files:
    - vault.yml
  roles:
    - nut

- name: Install Netdata monitoring
  hosts: proxmox:k3s_cluster
  become: yes
  vars_files:
    - vault.yml
  roles:
    - netdata
