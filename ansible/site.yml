---
# Main site playbook - applies roles to all infrastructure
- name: Configure base Proxmox settings
  hosts: proxmox
  become: true
  roles:
    - proxmox

- name: Setup Tailscale on all hosts
  hosts: proxmox:k3s_cluster:media_servers:backup_servers:dns_servers:mem0_servers
  become: true
  vars_files:
    - vault.yml
  roles:
    - tailscale

- name: Configure NUT UPS (auto-detect server/client)
  hosts: proxmox
  become: true
  vars_files:
    - vault.yml
  roles:
    - nut

- name: Install Netdata monitoring
  hosts: proxmox:k3s_cluster:dns_servers:media_servers:mem0_servers
  become: true
  vars_files:
    - vault.yml
  roles:
    - netdata

- name: Configure Jellyfin backup to Backblaze B2
  hosts: media_servers
  become: true
  vars_files:
    - vault.yml
  roles:
    - jellyfin_backup

- name: Setup DNS servers
  hosts: dns_servers
  become: true
  vars_files:
    - vault.yml
  roles:
    - adguard_home

- name: Deploy mem0 AI memory stack
  hosts: mem0_servers
  become: true
  vars_files:
    - vault.yml
  roles:
    - mem0

- name: Deploy Minecraft servers
  hosts: minecraft_servers
  become: true
  vars_files:
    - vault.yml
  pre_tasks:
    - name: Disable systemd-resolved
      ansible.builtin.systemd:
        name: systemd-resolved
        enabled: false
        state: stopped
      failed_when: false

    - name: Set static resolv.conf
      ansible.builtin.copy:
        content: "nameserver 10.150.60.11\n"
        dest: /etc/resolv.conf
        mode: "0644"
  roles:
    - minecraft
