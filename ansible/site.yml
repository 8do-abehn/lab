---
- name: Refuse to deploy from a stale branch
  ansible.builtin.import_playbook: branch_guard.yml

# One timezone everywhere. Until 2026-10-05 half the hosts were on UTC and half
# on America/Chicago, so the same cron time meant two different real times and
# backup schedules that looked staggered were not. cron only reads the zone at
# startup, so it is restarted when the zone actually changes.
- name: Set the timezone on every host
  hosts: all
  become: true
  tags: timezone
  vars:
    host_timezone: America/Chicago
  tasks:
    - name: Check the zoneinfo file exists
      ansible.builtin.stat:
        path: "/usr/share/zoneinfo/{{ host_timezone }}"
      register: zoneinfo

    - name: Fail if tzdata is missing
      ansible.builtin.assert:
        that: zoneinfo.stat.exists
        fail_msg: "/usr/share/zoneinfo/{{ host_timezone }} is missing. Install tzdata first."

    - name: Point /etc/localtime at the zone
      ansible.builtin.file:
        src: "/usr/share/zoneinfo/{{ host_timezone }}"
        dest: /etc/localtime
        state: link
        force: true
      register: localtime

    - name: Write /etc/timezone
      ansible.builtin.copy:
        content: "{{ host_timezone }}\n"
        dest: /etc/timezone
        mode: "0644"

    - name: Restart cron so jobs follow the new zone
      ansible.builtin.service:
        name: cron
        state: restarted
      when: localtime.changed

# Main site playbook - applies roles to all infrastructure
- name: Configure base Proxmox settings
  hosts: proxmox
  become: true
  roles:
    - proxmox

- name: Fix DNS resolution on LXC containers (#313)
  hosts: dns_servers:media_servers:mem0_servers:minecraft_servers:immich_servers
  become: true
  tags: resolv
  tasks:
    # Proxmox rewrites /etc/resolv.conf inside an LXC on every start (reboot,
    # HA migration) with its own "BEGIN PVE" block, which undoes the file below
    # and makes this play report changed on every run (#567). This marker is
    # Proxmox's documented opt-out: with it present, PVE leaves the file alone.
    - name: Stop Proxmox managing resolv.conf
      ansible.builtin.copy:
        content: ""
        dest: /etc/.pve-ignore.resolv.conf
        mode: "0644"
        force: false

    - name: Disable systemd-resolved
      ansible.builtin.systemd:
        name: systemd-resolved
        enabled: false
        state: stopped
      failed_when: false

    - name: Set static resolv.conf
      ansible.builtin.copy:
        content: |
          nameserver 1.1.1.1
          nameserver 8.8.8.8
        dest: /etc/resolv.conf
        mode: "0644"

- name: Setup Tailscale on all hosts
  hosts: proxmox:k3s_cluster:media_servers:backup_servers:dns_servers:mem0_servers:minecraft_servers:immich_servers:unifi_servers:encoders
  become: true
  vars_files:
    - vault.yml
  tags: tailscale
  roles:
    - tailscale

# UPS is cabled to pve01 (nut_server); pve02/pve03 monitor it as nut_netclients.
- name: Configure NUT UPS (server/client by group membership)
  hosts: nut
  become: true
  vars_files:
    - vault.yml
  roles:
    - nut

# Both Proxmox clusters plus the offsite backup target. smartd runs on all of
# them out of the box but its stock mail hook needs an MTA that is not there,
# so without this role their SMART alerts go nowhere at all.
- name: Configure SMART disk monitoring alerts (Apprise)
  hosts: proxmox:backup_servers
  become: true
  vars_files:
    - vault.yml
  tags:
    - smart
  roles:
    - smart_monitoring

# Hourly git history of /etc/pve and each node's rebuild files (#434). After
# smart_monitoring so /etc/apprise.yml exists for its failure alert.
- name: Keep /etc/pve version history
  hosts: proxmox
  become: true
  tags:
    - pve_config
  roles:
    - pve_config_history

# Encrypted, write-only daily copy of that history to the backup host (#568), in
# three steps because each side needs something from the other in the same run:
# node push keys -> receiver authorizes them and publishes its host key -> nodes
# pin that host key and install the push. Disabled until
# pve_config_offsite_recipient (an age public key) is set; see the role README.
- name: Prepare /etc/pve off-cluster push keys
  hosts: proxmox
  become: true
  tags:
    - pve_config
  tasks:
    - name: Push keys
      ansible.builtin.include_role:
        name: pve_config_offsite
        tasks_from: keys.yml

- name: Receive encrypted /etc/pve copies
  hosts: backup_servers
  become: true
  tags:
    - pve_config
  roles:
    - pve_config_receiver

- name: Push encrypted /etc/pve copies off-cluster
  hosts: proxmox
  become: true
  tags:
    - pve_config
  tasks:
    - name: Push
      ansible.builtin.include_role:
        name: pve_config_offsite
        tasks_from: push.yml

# Host-level counterpart to the in-container cephfs_client watchdog (#456):
# catches D-state FUSE hangs (#516) that a probe running inside the container
# can never detect, because it would hang inside its own health check too.
# Runs after smart_monitoring so /etc/apprise.yml already exists to notify
# through. A no-op on any host with no lxc_watchdog_targets set.
- name: Configure host-level LXC mount watchdog
  hosts: proxmox
  become: true
  tags:
    - lxc-watchdog
  roles:
    - lxc_mount_watchdog

# On 2026-09-27 mds, mgr and six OSDs stayed dead for hours after the switch
# outage (#524) because they died while waiting on a mon quorum and systemd
# never retried them, and nothing alerted (#529). The first role keeps them
# retrying; the second alerts on lost redundancy whatever the cause. Neither
# restarts a running Ceph daemon. Runs after smart_monitoring for
# /etc/apprise.yml.
- name: Keep Ceph daemons recoverable and alert on lost redundancy
  hosts: proxmox
  become: true
  tags:
    - ceph
  roles:
    - ceph_daemon_restart
    - ceph_redundancy_check

- name: Install Netdata monitoring
  hosts: proxmox:k3s_cluster:dns_servers:media_servers:mem0_servers:minecraft_servers:immich_servers
  become: true
  vars_files:
    - vault.yml
  roles:
    - netdata

# ceph-fuse OOM'd on jellyfin01 and left a stale mount that hid the media
# library for 27 hours (#456). This bounds the client so it cannot take the
# container down with it.
- name: Tune the CephFS FUSE client on the media LXCs
  hosts: media_servers
  become: true
  tags:
    - cephfs
  roles:
    - cephfs_client

- name: Configure Jellyfin backup to Backblaze B2
  hosts: media_servers
  become: true
  tags: backup
  vars_files:
    - vault.yml
  roles:
    - jellyfin_backup

- name: Configure restic backup clients
  hosts: backup_clients
  become: true
  tags: backup
  vars_files:
    - vault.yml
  roles:
    - backup_client

- name: Configure riplab encoders
  hosts: encoders
  become: true
  roles:
    - encoder

- name: Setup DNS servers
  hosts: dns_servers
  become: true
  vars_files:
    - vault.yml
  roles:
    - adguard_home

- name: Deploy mem0 AI memory stack
  hosts: mem0_servers
  become: true
  vars_files:
    - vault.yml
  roles:
    - mem0

- name: Deploy Minecraft servers
  hosts: minecraft_servers
  tags: minecraft
  become: true
  vars_files:
    - vault.yml
  roles:
    - minecraft

- name: Setup Cloudflare Tunnels
  hosts: cloudflare_tunnel
  become: true
  tags: cloudflare
  vars_files:
    - vault.yml
  roles:
    - cloudflare_tunnel

- name: Setup Cloudflare IP Registration
  hosts: cloudflare_ip_registration
  become: true
  tags: cloudflare
  vars_files:
    - vault.yml
  roles:
    - cloudflare_ip_registration
