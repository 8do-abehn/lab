---
# Deploying from a feature branch does not merely skip newer work, it actively
# reverts anything merged after that branch was cut. On 2026-09-19 a deploy run
# from a branch predating #483 and #486 rewrote jellyfin01's backup scripts
# without the concurrency guard or the bandwidth limit, reported changed=3, and
# looked exactly like a successful run.
#
# Check mode is exempt: CI runs site.yml --check from PR branches by design.
- name: Refuse to deploy from a stale branch
  hosts: all
  gather_facts: false
  run_once: true
  tags: always
  tasks:
    - name: Determine the checked out branch
      ansible.builtin.command: git rev-parse --abbrev-ref HEAD
      args:
        chdir: "{{ playbook_dir }}"
      delegate_to: localhost
      become: false
      register: deploy_branch
      changed_when: false
      failed_when: false

    - name: Fail when deploying from anything other than main
      ansible.builtin.fail:
        msg: |
          Refusing to deploy from branch '{{ deploy_branch.stdout | default("unknown") }}'.

          A deploy applies whatever templates the checked out branch holds. If the
          branch was cut before something merged, this run will silently REVERT it
          on the target hosts and still report success.

          Either:
            git checkout main && git pull
          or, if you genuinely mean to deploy this branch:
            -e allow_branch_deploy=true
      when:
        - not ansible_check_mode
        - deploy_branch.stdout | default('') not in ['main', 'HEAD']
        - not (allow_branch_deploy | default(false) | bool)

# Main site playbook - applies roles to all infrastructure
- name: Configure base Proxmox settings
  hosts: proxmox
  become: true
  roles:
    - proxmox

- name: Fix DNS resolution on LXC containers (#313)
  hosts: dns_servers:media_servers:mem0_servers:minecraft_servers:immich_servers
  become: true
  tasks:
    - name: Disable systemd-resolved
      ansible.builtin.systemd:
        name: systemd-resolved
        enabled: false
        state: stopped
      failed_when: false

    - name: Set static resolv.conf
      ansible.builtin.copy:
        content: |
          nameserver 1.1.1.1
          nameserver 8.8.8.8
        dest: /etc/resolv.conf
        mode: "0644"

- name: Setup Tailscale on all hosts
  hosts: proxmox:k3s_cluster:media_servers:backup_servers:dns_servers:mem0_servers:minecraft_servers:immich_servers
  become: true
  vars_files:
    - vault.yml
  roles:
    - tailscale

# UPS is cabled to pve01 (nut_server); pve02/pve03 monitor it as nut_netclients.
- name: Configure NUT UPS (server/client by group membership)
  hosts: nut
  become: true
  vars_files:
    - vault.yml
  roles:
    - nut

# Both Proxmox clusters plus the offsite backup target. smartd runs on all of
# them out of the box but its stock mail hook needs an MTA that is not there,
# so without this role their SMART alerts go nowhere at all.
- name: Configure SMART disk monitoring alerts (Apprise)
  hosts: proxmox:backup_servers
  become: true
  vars_files:
    - vault.yml
  tags:
    - smart
  roles:
    - smart_monitoring

- name: Install Netdata monitoring
  hosts: proxmox:k3s_cluster:dns_servers:media_servers:mem0_servers:minecraft_servers:immich_servers
  become: true
  vars_files:
    - vault.yml
  roles:
    - netdata

# ceph-fuse OOM'd on jellyfin01 and left a stale mount that hid the media
# library for 27 hours (#456). This bounds the client so it cannot take the
# container down with it.
- name: Tune the CephFS FUSE client on the media LXCs
  hosts: media_servers
  become: true
  tags:
    - cephfs
  roles:
    - cephfs_client

- name: Configure Jellyfin backup to Backblaze B2
  hosts: media_servers
  become: true
  tags: backup
  vars_files:
    - vault.yml
  roles:
    - jellyfin_backup

- name: Configure restic backup clients
  hosts: backup_clients
  become: true
  tags: backup
  vars_files:
    - vault.yml
  roles:
    - backup_client

- name: Setup DNS servers
  hosts: dns_servers
  become: true
  vars_files:
    - vault.yml
  roles:
    - adguard_home

- name: Deploy mem0 AI memory stack
  hosts: mem0_servers
  become: true
  vars_files:
    - vault.yml
  roles:
    - mem0

- name: Deploy Minecraft servers
  hosts: minecraft_servers
  tags: minecraft
  become: true
  vars_files:
    - vault.yml
  roles:
    - minecraft

- name: Setup Cloudflare Tunnels
  hosts: cloudflare_tunnel
  become: true
  tags: cloudflare
  vars_files:
    - vault.yml
  roles:
    - cloudflare_tunnel

- name: Setup Cloudflare IP Registration
  hosts: cloudflare_ip_registration
  become: true
  tags: cloudflare
  vars_files:
    - vault.yml
  roles:
    - cloudflare_ip_registration
