---
# Legacy cluster settings (pve001-006, 10.150.10.0/24)

# NUT configuration (auto-detects server vs client)
nut_mode: auto

# UPS device configuration (for server)
ups_name: myups
ups_driver: apcsmart
ups_port: /dev/ttyS0
ups_desc: "APC SMART-UPS 2200"
ups_admin_user: admin
ups_monitor_user: monuser

# Client configuration (server IP is auto-detected from 10.150.10.x range)
ups_server_ip: 10.150.10.44  # Fallback only if auto-detection fails
ups_user: monuser

# IMPORTANT: For maximum reliability during power outages, consider adding
# an /etc/hosts entry mapping the UPS server IP to hostname on all clients
