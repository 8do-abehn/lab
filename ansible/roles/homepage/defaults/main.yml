---
# Homepage (gethomepage.dev) dashboard, served as svc:home

homepage_dir: /opt/homepage
homepage_image: "ghcr.io/gethomepage/homepage:v2.4.0"

# Bound to loopback only: tailscale serve is the one way in, with TLS.
homepage_port: 3010
homepage_hostname: "home.{{ tailnet_domain }}"

# Resolvers for the container. AdGuard on dns01 forwards the tailnet zone to
# MagicDNS, which the site monitors need for the *.<tailnet> names; mem01
# itself runs with --accept-dns=false and cannot resolve them. Both AdGuard
# hosts, never a public resolver: public DNS returns NXDOMAIN for the tailnet
# zone, so a fallback to it turns every status dot red while dns01 is down.
homepage_dns:
  - 10.150.60.11  # dns01
  - 10.150.60.12  # dns02

homepage_settings:
  title: Lab
  theme: dark
  color: slate
  headerStyle: clean
  statusStyle: dot
  layout:
    Media:
      style: row
      columns: 2
    Infrastructure:
      style: row
      columns: 4
    AI:
      style: row
      columns: 2
    Tools:
      style: row
      columns: 2
    Weather:
      style: row
      columns: 3

# Wisconet (UW-Madison's Wisconsin mesonet) station for the Weather tile. The
# API needs no key. Station IDs: https://wisconet.wisc.edu/api/v1/stations/
homepage_wisconet_station: RTHR
homepage_wisconet_slug: arthur
# Wisconet's latest_measures is a list that customapi could only read by
# position. A timer per entry below fetches and reshapes it on the host
# (files/weather-fetch.sh, #651), and a busybox httpd in the compose project
# serves the result to Homepage on the compose network only, as
# http://weather:8080/<name>.json. The name also selects the reshape.
homepage_weather_dir: "{{ homepage_dir }}/weather"
homepage_weather_image: "busybox:1.37"
homepage_weather_base_url: http://weather:8080
homepage_weather_fetches:
  - name: wisconet
    url: "https://wisconet.wisc.edu/api/v1/stations/{{ homepage_wisconet_station }}/latest_measures"
    interval: 5min
# Fetch jobs that used to exist; their units are stopped and removed. The
# forecast moved into the browser (templates/forecast-table.html.j2).
homepage_weather_fetches_removed:
  - forecast
# The station's own coordinates, for the current conditions in the header.
homepage_weather_latitude: 45.032
homepage_weather_longitude: -91.200
# NWS forecast for the same spot. The grid point comes from
# https://api.weather.gov/points/<lat>,<lon> (properties.forecast) and only
# changes if the coordinates do.
homepage_nws_forecast_url: https://api.weather.gov/gridpoints/MPX/177,76/forecast
# Days in the Forecast table. NWS forecasts 7.
homepage_forecast_days: 5
# Active NWS alerts (warnings, watches, advisories) for the same point, shown
# above the Forecast table.
homepage_nws_alerts_url: "https://api.weather.gov/alerts/active?point={{ homepage_weather_latitude }},{{ homepage_weather_longitude }}"
# NWS rejects requests without a User-Agent and asks for a contact in it.
# Only the Wisconet fetch sends this one; browsers send their own.
homepage_nws_user_agent: "lab-homepage (github.com/8do-abehn/lab)"
# NWS radar for the Radar tile. KARX (La Crosse) has the station near the top
# center, with Eau Claire and Rice Lake labelled; KMPX (Twin Cities) has it at
# the east edge, and the UPPERMISSVLY mosaic is centred on Iowa.
homepage_radar_site: KARX

# Rendered as-is into services.yaml, so this is Homepage's own format:
# https://gethomepage.dev/configs/services/
# Most hrefs are Tailscale Service names, which resolve and have a valid
# certificate both on the tailnet and on the default LAN (through AdGuard).
# changedetection is a hand-built host outside Ansible and is linked by machine
# name instead. A Service for it could not reuse the machine name: MagicDNS
# answers it with the machine (see svc:network, svc:read).
homepage_services:
  - Media:
      - Jellyfin:
          href: "https://jellyfin.{{ tailnet_domain }}"
          icon: jellyfin.png
          description: Movies and TV
          siteMonitor: "https://jellyfin.{{ tailnet_domain }}/health"
      - Immich:
          href: "https://immich.{{ tailnet_domain }}"
          icon: immich.png
          description: Photo library
          siteMonitor: "https://immich.{{ tailnet_domain }}"
  - Infrastructure:
      - Proxmox:
          href: "https://proxmox.{{ tailnet_domain }}"
          icon: proxmox.png
          description: pve01-03 cluster
          siteMonitor: "https://proxmox.{{ tailnet_domain }}"
      - UniFi:
          href: "https://network.{{ tailnet_domain }}"
          icon: unifi.png
          description: Network controller
          siteMonitor: "https://network.{{ tailnet_domain }}"
      - AdGuard Home:
          href: "https://dns.{{ tailnet_domain }}"
          icon: adguard-home.png
          description: DNS and ad blocking
          siteMonitor: "https://dns.{{ tailnet_domain }}"
      - Netdata:
          href: https://app.netdata.cloud
          icon: netdata.png
          description: Monitoring
      - Portainer:
          href: "https://portainer.{{ tailnet_domain }}"
          icon: portainer.png
          description: Containers on the docker LXC
          siteMonitor: "https://portainer.{{ tailnet_domain }}/api/system/status"
  - AI:
      - Open WebUI:
          href: "https://chat.{{ tailnet_domain }}"
          icon: open-webui.png
          description: Chat with the local models
          siteMonitor: "https://chat.{{ tailnet_domain }}"
      - OpenMemory:
          icon: mdi-brain
          description: Memory API for agents, no UI
          siteMonitor: "https://mem0.{{ tailnet_domain }}/health"
  - Tools:
      - changedetection:
          href: "https://changedetection.{{ tailnet_domain }}"
          icon: changedetection.png
          description: Website change alerts
          siteMonitor: "https://changedetection.{{ tailnet_domain }}"
      # svc:read, not svc:readeck: the machine is named readeck.
      - Readeck:
          href: "https://read.{{ tailnet_domain }}"
          icon: readeck.png
          description: Read-later and bookmarks
          siteMonitor: "https://read.{{ tailnet_domain }}/api/info"
  - Weather:
      # Fields are Wisconet standard_names, read from the reshaped file (see
      # homepage_weather_fetches above). A field Wisconet drops shows as null
      # rather than as some other field's number.
      # "Yesterday" rows: the daily_* fields cover the previous full day.
      - Arthur:
          href: "https://wisconet.wisc.edu/stations/{{ homepage_wisconet_slug }}"
          icon: mdi-weather-partly-cloudy
          description: Wisconet station, 5-minute readings
          widget:
            type: customapi
            url: "{{ homepage_weather_base_url }}/wisconet.json"
            # The station reports, and the timer fetches, every 5 minutes.
            refreshInterval: 300000
            display: list
            mappings:
              - field: 5min_air_temp_f_avg
                label: Temperature
                suffix: "°F"
              - field: 5min_dew_point_f_avg_calc
                label: Dew point
                suffix: "°F"
              - field: 5min_relative_humidity_pct_avg
                label: Humidity
                suffix: "%"
              - field: 5min_wind_speed_mph_avg
                label: Wind
                suffix: mph
              - field: daily_air_temp_f_max
                label: High yesterday
                suffix: "°F"
              - field: daily_air_temp_f_min
                label: Low yesterday
                suffix: "°F"
              - field: daily_rain_in_tot
                label: Rain yesterday
                suffix: in
              # The air temperature's collection_time, in epoch seconds;
              # relativeDate wants ms.
              - field: collection_time
                label: Updated
                scale: 1000
                format: relativeDate
      # Active alerts, then a table (day, sky, high, low, rain), filled by the
      # browser from NWS.
      # The page is templates/forecast-table.html.j2, inlined as a data: URL
      # like the radar; it refetches whenever the iframe reloads.
      - Forecast:
          href: "https://forecast.weather.gov/MapClick.php?lat={{ homepage_weather_latitude }}&lon={{ homepage_weather_longitude }}"
          icon: mdi-weather-cloudy-clock
          description: National Weather Service
          widget:
            type: iframe
            name: forecast
            src: "data:text/html;charset=utf-8,{{ lookup('ansible.builtin.template', role_path ~ '/templates/forecast-table.html.j2') | urlencode }}"
            # NWS updates the forecast about hourly; alerts can come at any
            # time, so the tile reloads every 5 minutes.
            refreshInterval: 300000
            allowScrolling: "no"
            # Room for the table plus up to 2 alert rows and "+N more"
            # (about 340px); quiet days leave space at the bottom.
            classes: h-96
      # The browser loads this, not the container. A bare image in an iframe
      # shows at its own 600px size and gets cropped to the tile, so the src
      # is a one-line HTML page that scales the GIF to fit. It is a data: URL,
      # so "#" and "%" are written %23 and %25. NWS regenerates the loop every
      # few minutes; the iframe reloads on the same cadence.
      - Radar:
          href: "https://radar.weather.gov/station/{{ homepage_radar_site | lower }}/standard"
          icon: mdi-radar
          description: "NWS radar, {{ homepage_radar_site }}"
          widget:
            type: iframe
            name: radar
            src: >-
              data:text/html,<body style='margin:0;background:transparent'>
              <img src='https://radar.weather.gov/ridge/standard/{{ homepage_radar_site }}_loop.gif'
              style='display:block;width:100%25;height:100vh;object-fit:contain'>
            refreshInterval: 300000
            allowScrolling: "no"
            classes: h-96

homepage_bookmarks:
  - Lab:
      - Blog:
          - href: https://lab.8devops.com
            abbr: BL
      - Repo:
          - href: https://github.com/8do-abehn/lab
            icon: github.png
      - Tailscale:
          - href: https://login.tailscale.com/admin/machines
            icon: tailscale.png

homepage_widgets:
  # Wisconet has no forecast (its own site uses the NWS for that), so the
  # header shows Open-Meteo's current conditions for the same spot.
  - openmeteo:
      label: Arthur
      latitude: "{{ homepage_weather_latitude }}"
      longitude: "{{ homepage_weather_longitude }}"
      timezone: America/Chicago
      units: imperial
      cache: 15
  - datetime:
      format:
        dateStyle: medium
        timeStyle: short
  - search:
      provider: duckduckgo
      target: _blank
