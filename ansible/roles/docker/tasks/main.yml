---
- name: Install Docker prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true

- name: Create keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Set Docker repo facts
  ansible.builtin.set_fact:
    docker_arch: "{{ ansible_facts['architecture'] | regex_replace('x86_64', 'amd64') }}"
    docker_distro: "{{ ansible_facts['distribution'] | lower }}"
    docker_codename: >-
      {{ 'bookworm'
         if ansible_facts['distribution_release'] in ['trixie', 'testing', 'n/a']
         else ansible_facts['distribution_release'] }}

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ docker_distro }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ docker_arch }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/{{ docker_distro }}
      {{ docker_codename }} stable
    state: present
    update_cache: true

- name: Install Docker CE and Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present

- name: Ensure Docker service is running
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
