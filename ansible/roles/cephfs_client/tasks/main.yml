---
# ceph.conf is appended to rather than templated. The file already carries
# mon_host, written when the container was built, and templating it would mean
# taking ownership of a value we would then have to keep in sync with the
# cluster by hand. A marked blockinfile section leaves the rest untouched.
- name: Bound the CephFS client caches
  ansible.builtin.blockinfile:
    path: /etc/ceph/ceph.conf
    marker: "# {mark} ANSIBLE MANAGED - cephfs_client"
    block: |
      [client]
      client_oc_size = {{ cephfs_client_oc_size }}
      client_cache_size = {{ cephfs_client_cache_size }}
    create: false
    mode: "0644"
  register: cephfs_conf
  when: cephfs_client_enabled | bool

- name: Create systemd drop-in directory for the mount unit
  ansible.builtin.file:
    path: /etc/systemd/system/{{ cephfs_client_mount_unit }}.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: cephfs_client_enabled | bool

- name: Apply a soft memory ceiling to the CephFS mount unit
  ansible.builtin.template:
    src: resources.conf.j2
    dest: /etc/systemd/system/{{ cephfs_client_mount_unit }}.d/resources.conf
    owner: root
    group: root
    mode: "0644"
  register: cephfs_dropin
  when: cephfs_client_enabled | bool

# daemon-reload applies MemoryHigh to the already-running cgroup, so this takes
# effect without remounting. Skipped in check mode because the drop-in has not
# actually been written there.
- name: Reload systemd so the memory ceiling applies to the running mount
  ansible.builtin.systemd:
    daemon_reload: true
  when:
    - cephfs_client_enabled | bool
    - cephfs_dropin.changed
    - not ansible_check_mode

# Deliberately no remount here. ceph.conf is only read when ceph-fuse starts,
# so the cache settings apply at the next mount. Forcing one would interrupt
# Jellyfin playback for a tuning change that is not urgent.
- name: Note that cache settings need a remount to take effect
  ansible.builtin.debug:
    msg: >-
      ceph.conf changed; client cache settings apply on the next mount of
      {{ cephfs_client_mount_unit }}. The MemoryHigh ceiling is already live.
  when:
    - cephfs_client_enabled | bool
    - cephfs_conf.changed

# Watchdog (#456). Deliberately a timer rather than converting the mount to an
# .automount unit: automount would make the path a mountpoint even when the
# real filesystem is absent, which silently defeats the backup mount guard in
# backup.sh that aborts on an unmounted /mnt/library (#457).
- name: Deploy the CephFS mount watchdog
  ansible.builtin.template:
    src: cephfs-watchdog.sh.j2
    dest: "{{ cephfs_client_watchdog_script }}"
    owner: root
    group: root
    mode: "0755"
  when:
    - cephfs_client_enabled | bool
    - cephfs_client_watchdog_enabled | bool

- name: Install the CephFS watchdog service
  ansible.builtin.copy:
    dest: /etc/systemd/system/cephfs-watchdog.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Probe and recover the CephFS mount ({{ cephfs_client_mount_path }})
      Documentation=https://github.com/8do-abehn/lab/issues/456
      After=network-online.target

      [Service]
      Type=oneshot
      ExecStart={{ cephfs_client_watchdog_script }}
  register: cephfs_watchdog_unit
  when:
    - cephfs_client_enabled | bool
    - cephfs_client_watchdog_enabled | bool

- name: Install the CephFS watchdog timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/cephfs-watchdog.timer
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Probe the CephFS mount every {{ cephfs_client_watchdog_interval }}
      Documentation=https://github.com/8do-abehn/lab/issues/456

      [Timer]
      # OnBootSec covers the boot race directly: the mount unit may have already
      # failed before the MDS was reachable, and nothing else would retry it.
      OnBootSec=2min
      OnUnitActiveSec={{ cephfs_client_watchdog_interval }}
      AccuracySec=30s

      [Install]
      WantedBy=timers.target
  register: cephfs_watchdog_timer
  when:
    - cephfs_client_enabled | bool
    - cephfs_client_watchdog_enabled | bool

- name: Enable the CephFS watchdog timer
  ansible.builtin.systemd:
    name: cephfs-watchdog.timer
    enabled: true
    state: started
    daemon_reload: "{{ (cephfs_watchdog_unit.changed or cephfs_watchdog_timer.changed) | bool }}"
  when:
    - cephfs_client_enabled | bool
    - cephfs_client_watchdog_enabled | bool
    - not ansible_check_mode

- name: Rotate the watchdog log
  ansible.builtin.copy:
    dest: /etc/logrotate.d/cephfs-watchdog
    owner: root
    group: root
    mode: "0644"
    content: |
      {{ cephfs_client_watchdog_log }} {
          weekly
          rotate 4
          compress
          missingok
          notifempty
      }
  when:
    - cephfs_client_enabled | bool
    - cephfs_client_watchdog_enabled | bool
