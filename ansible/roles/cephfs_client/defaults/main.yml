---
# CephFS FUSE client tuning for the media LXCs.
#
# Context: ceph-fuse on jellyfin01 grew to 3.5GB inside a 4096MB container and
# was OOM-killed on 2026-09-10, leaving a stale mount that took the Jellyfin
# library offline for 27 hours (#456). The container OOM-killed three more
# processes over the following week, so the pressure is chronic, not a one-off.

cephfs_client_enabled: true

# Soft memory ceiling for the mount unit's cgroup. Above this the kernel
# applies reclaim pressure to ceph-fuse instead of letting it grow until the
# container's OOM killer picks a victim at random.
#
# Deliberately MemoryHigh and NOT MemoryMax. A hard cap would kill ceph-fuse
# alone rather than taking down a neighbour, which sounds better but still
# leaves a stale mount nobody notices. Revisit once the mount watchdog from
# #456 exists to recover automatically.
cephfs_client_memory_high: 1500M

# Bound the client caches. These are below Ceph's defaults (oc_size 200MB,
# cache_size 16384 inodes). Note this does NOT by itself explain the 3.5GB
# peak, so treat it as reducing growth pressure rather than as the fix; the
# cgroup limit above is what actually bounds the process.
cephfs_client_oc_size: 104857600
cephfs_client_cache_size: 8192

# The mount unit this applies to. Still hand written and unmanaged, see #456.
cephfs_client_mount_unit: mnt-library.mount
cephfs_client_mount_path: /mnt/library

# Mount watchdog (#456). Recovers the two failures actually seen: a boot race
# that left the unit failed and nothing retrying (2026-09-06, offline 2 days),
# and an OOM-killed ceph-fuse that left a stale mount (2026-09-10, offline 27
# hours). The second is why the health check is a real read rather than
# mountpoint -q, which a stale FUSE mount passes.
cephfs_client_watchdog_enabled: true

# How often to probe. Frequent enough that an outage is minutes rather than
# days, infrequent enough to be negligible: the probe is one directory read.
cephfs_client_watchdog_interval: 5min

# Timeout on the read probe. Without it the watchdog would hang on a stale
# mount, which is exactly when it needs to run.
cephfs_client_watchdog_probe_timeout: 10

cephfs_client_watchdog_log: /var/log/cephfs-watchdog.log
cephfs_client_watchdog_script: /usr/local/bin/cephfs-watchdog.sh

# Ceph upstream apt repo (#515). Ubuntu 24.04 ships ceph-fuse 18.2.7, which
# predates aes256k cephx support (Squid 19.2.6 / Tentacle 20.2.4) and blocks
# rotating client.lxc-media off the deprecated aes cipher (CVE-2025-30156).
# Ubuntu never backports newer Ceph point releases into noble, so the fix is
# Ceph's own repo, same pattern as the docker role's download.docker.com repo.
#
# Tentacle over Squid because Squid's debian-squid repo never published a
# noble build, only bookworm/jammy; Tentacle does (verified 2026-09-23).
cephfs_client_upstream_repo_enabled: true
cephfs_client_upstream_repo_url: https://download.ceph.com/debian-tentacle
cephfs_client_upstream_repo_key_url: https://download.ceph.com/keys/release.asc
cephfs_client_min_version: "20.2.4"
