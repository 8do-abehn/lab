---
# Backup client defaults

# Backup target - Pi backup server via Tailscale
backup_server_host: pi-burg
backup_server_user: backup
backup_server_repo_path: /mnt/backup/restic-repo

# Restic password (same as server)
restic_password: "{{ vault_restic_password }}"

# Paths to backup
backup_paths:
  - /mnt/library

# Paths from backup_paths that live on a separate filesystem and must be
# mounted for the backup to mean anything. Checked before restic runs: if one
# is missing or empty the backup aborts instead of snapshotting an empty
# directory and reporting success. Opt-in per host, since most hosts back up
# local paths only.
backup_required_mounts: []

# Paths to exclude
backup_excludes:
  - "*.tmp"
  - "lost+found"
  - "tmp/"

# Schedule (cron format)
backup_cron_hour: "2"
backup_cron_minute: "0"

# Retention policy
backup_keep_daily: 7
backup_keep_weekly: 4
backup_keep_monthly: 6

# Pruning. `restic forget --prune` walks the entire repository and holds an
# exclusive repo lock for the whole run. Every client shares one repo over sftp,
# so running it nightly on every host does not scale, and a run that hangs leaves
# exactly the stale lock #429 tracks.
#
# Split instead: nightly `restic forget` (metadata only, fast) on every client,
# plus one weekly `restic prune` on a single designated host. Prune reclaims space
# for the whole repo, not just that host's snapshots, so set backup_prune_enabled
# on exactly one client.
#
# Prune runs client-side deliberately. pi-burg is a Pi 3 with under 1GB of RAM and
# would OOM long before finishing, so it cannot prune its own repo locally.
backup_prune_inline: false
backup_prune_enabled: false

# Weekly prune schedule. Sunday 9am keeps it clear of every backup window (2-3am)
# and every repository check (6-7am), so the locks never overlap.
backup_prune_cron_hour: "9"
backup_prune_cron_minute: "0"
backup_prune_cron_weekday: "0"

backup_prune_script_path: /usr/local/bin/restic-prune.sh

# Notifications (Apprise)
backup_notify_enabled: true
backup_apprise_urls: "{{ vault_backup_apprise_urls | default('') }}"

# Throttle restic network transfer, in KiB/s, applied symmetrically to upload
# and download. Empty means no limit, which is the right default for local or
# well-connected targets. Set it per host when the far end is on a connection
# someone else has to live with: pi-burg is offsite on a domestic link, where an
# unthrottled run would consume most of that household's bandwidth for hours
# (#478). 5120 is roughly 40 Mbit/s.
backup_bandwidth_limit: ""

# Shared lock for every restic job against this repo. On tmpfs on purpose, so a
# reboot never leaves a stale lock behind. See #479.
backup_lock_file: /run/restic-backup.lock

# Script and log locations
backup_script_path: /usr/local/bin/backup-library.sh
backup_check_script_path: /usr/local/bin/restic-check.sh
backup_log_path: /var/log/restic-backup.log

# Restic password file (kept out of the backup scripts themselves)
backup_password_file: /etc/restic/password

# Weekly check schedule (default: Sunday 6am)
backup_check_cron_hour: "6"
backup_check_cron_minute: "0"
backup_check_cron_weekday: "0"
