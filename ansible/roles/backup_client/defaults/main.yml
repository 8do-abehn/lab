---
# Backup client defaults

# Backup target - Pi backup server via Tailscale
backup_server_host: pi-burg
backup_server_user: backup
backup_server_repo_path: /mnt/backup/restic-repo

# Restic password (same as server)
restic_password: "{{ vault_restic_password }}"

# Paths to backup
backup_paths:
  - /mnt/library

# Paths to exclude
backup_excludes:
  - "*.tmp"
  - "lost+found"
  - "tmp/"

# Schedule (cron format)
backup_cron_hour: "2"
backup_cron_minute: "0"

# Retention policy
backup_keep_daily: 7
backup_keep_weekly: 4
backup_keep_monthly: 6

# Notifications (Apprise)
backup_notify_enabled: true
backup_apprise_urls: "{{ vault_backup_apprise_urls | default('') }}"

# Script and log locations
backup_script_path: /usr/local/bin/backup-library.sh
backup_check_script_path: /usr/local/bin/restic-check.sh
backup_log_path: /var/log/restic-backup.log

# Weekly check schedule (default: Sunday 6am)
backup_check_cron_hour: "6"
backup_check_cron_minute: "0"
backup_check_cron_weekday: "0"
