---
# Install restic, deploy backup script, configure cron

- name: Install restic
  ansible.builtin.apt:
    name: restic
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install pipx for Python package management
  ansible.builtin.apt:
    name: pipx
    state: present
  when: backup_notify_enabled | bool

- name: Check if apprise is installed
  ansible.builtin.command: apprise --version
  register: apprise_check
  failed_when: false
  changed_when: false
  when: backup_notify_enabled | bool

- name: Install apprise for backup notifications
  ansible.builtin.command: pipx install apprise
  changed_when: true
  environment:
    PIPX_HOME: /opt/pipx
    PIPX_BIN_DIR: /usr/local/bin
  when:
    - backup_notify_enabled | bool
    - apprise_check.rc != 0

- name: Deploy apprise config (credential lives here, not in the backup script)
  ansible.builtin.template:
    src: apprise.yml.j2
    dest: /etc/apprise.yml
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: backup_notify_enabled | bool

- name: Create restic config directory
  ansible.builtin.file:
    path: "{{ backup_password_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Deploy restic password file
  ansible.builtin.copy:
    content: "{{ restic_password }}"
    dest: "{{ backup_password_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Deploy backup script
  ansible.builtin.template:
    src: backup.sh.j2
    dest: "{{ backup_script_path }}"
    owner: root
    group: root
    mode: "0755"

# Replaces the packaged unit to drop After=remote-fs.target, which never
# completes in an LXC and leaves cron never starting (#415).
#
# Deliberately NO -P on the ExecStart. The packaged Ubuntu unit carries it and
# this override was originally copied from there, but Debian trixie's cron
# (3.0pl1-197) rejects it outright:
#
#   /usr/sbin/cron: invalid option -- 'P'
#
# immich01 is Debian 13 and its cron had been dead for 24h as a result, so its
# backup was scheduled and could never have run. Dropping the flag is safe:
# backup.sh sets its own PATH for /usr/local/bin (apprise), and every other
# binary it calls lives in /usr/bin, which is in cron's default PATH anyway.
- name: Copy cron service unit without remote-fs dependency
  ansible.builtin.copy:
    dest: /etc/systemd/system/cron.service
    content: |
      [Unit]
      Description=Regular background program processing daemon
      Documentation=man:cron(8)
      After=nss-user-lookup.target

      [Service]
      EnvironmentFile=-/etc/default/cron
      ExecStart=/usr/sbin/cron -f $EXTRA_OPTS
      IgnoreSIGPIPE=false
      KillMode=process
      Restart=on-failure
      SyslogFacility=cron

      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd and restart cron

- name: Remove stale cron override directory
  ansible.builtin.file:
    path: /etc/systemd/system/cron.service.d
    state: absent
  notify: Reload systemd and restart cron

- name: Ensure cron is running
  ansible.builtin.systemd:
    name: cron
    state: started
    enabled: true

# cron.service has no Type=, so it defaults to Type=simple: systemd reports
# success the moment the binary is exec'd, not once it survives. A cron that
# exits 1 immediately still reports "ok" to the task above.
#
# That is exactly what happened on immich01 2026-09-20: the deploy logged
# "ok: [immich01]" while cron was already failing, so the role reported a
# working backup schedule on a host where nothing would ever run. A backup
# that is silently never scheduled is worse than one that fails loudly.
- name: Verify cron actually stayed up
  ansible.builtin.command: systemctl is-active cron
  register: backup_cron_active
  changed_when: false
  failed_when: backup_cron_active.stdout | trim != "active"
  retries: 3
  delay: 2
  until: backup_cron_active.stdout | trim == "active"
  when: not ansible_check_mode

- name: Setup backup cron job
  ansible.builtin.cron:
    name: "Restic backup to Pi"
    minute: "{{ backup_cron_minute }}"
    hour: "{{ backup_cron_hour }}"
    job: "{{ backup_script_path }}"
    user: root
    state: present

- name: Deploy restic check script
  ansible.builtin.template:
    src: restic-check.sh.j2
    dest: "{{ backup_check_script_path }}"
    owner: root
    group: root
    mode: "0755"

- name: Setup weekly restic check cron
  ansible.builtin.cron:
    name: "Restic repository check"
    minute: "{{ backup_check_cron_minute }}"
    hour: "{{ backup_check_cron_hour }}"
    weekday: "{{ backup_check_cron_weekday }}"
    job: "{{ backup_check_script_path }}"
    user: root
    state: present

- name: Deploy restic prune script
  ansible.builtin.template:
    src: restic-prune.sh.j2
    dest: "{{ backup_prune_script_path }}"
    owner: root
    group: root
    mode: "0755"
  when: backup_prune_enabled | bool

# Keep the host clean if pruning is handed to a different client later.
- name: Remove restic prune script when pruning is disabled
  ansible.builtin.file:
    path: "{{ backup_prune_script_path }}"
    state: absent
  when: not (backup_prune_enabled | bool)

- name: Setup weekly restic prune cron
  ansible.builtin.cron:
    name: "Restic repository prune"
    minute: "{{ backup_prune_cron_minute }}"
    hour: "{{ backup_prune_cron_hour }}"
    weekday: "{{ backup_prune_cron_weekday }}"
    job: "{{ backup_prune_script_path }}"
    user: root
    state: "{{ 'present' if backup_prune_enabled | bool else 'absent' }}"

- name: Deploy logrotate config
  ansible.builtin.copy:
    src: logrotate
    dest: /etc/logrotate.d/restic-backup
    owner: root
    group: root
    mode: "0644"
