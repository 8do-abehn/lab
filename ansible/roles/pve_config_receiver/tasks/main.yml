---
# Which nodes push here, and with which key, must not depend on which hosts
# happen to be in this run: a --limit or an unreachable node would otherwise
# rewrite authorized_keys without the others and silently cut them off. So:
#   - on/off comes from inventory (any client with a recipient set), not runtime;
#   - each node's key is this run's fact if present, else the key already
#     authorized here, so a partial run never drops anyone;
#   - every key must be exactly one ssh-ed25519 key, and only its first two
#     fields are ever written. A node's key file is under that node's control:
#     a second line in it must never become an unrestricted login here.
# Enabled only on the host the clients actually target: #512 keeps pi-burg and
# pve006 in backup_servers together until cutover, and the other one must not
# expect pushes (it would alert "never pushed" every day).
- name: Decide whether this host is the active receiver (from inventory, not this run)
  ansible.builtin.set_fact:
    pve_config_receiver_enabled: >-
      {{ groups[pve_config_receiver_clients_group] | default([])
         | map('extract', hostvars)
         | selectattr('pve_config_offsite_recipients', 'defined')
         | selectattr('pve_config_offsite_recipients')
         | selectattr('pve_config_offsite_target', 'defined')
         | selectattr('pve_config_offsite_target', 'equalto', inventory_hostname)
         | list | length > 0 }}

- name: Read the keys already authorized here
  ansible.builtin.slurp:
    src: "/etc/ssh/authorized_keys.d/{{ pve_config_receiver_user }}"
  register: pve_config_receiver_existing_raw
  failed_when: false

- name: Index the already-authorized keys by node
  ansible.builtin.set_fact:
    pve_config_receiver_existing: >-
      {{ dict((pve_config_receiver_existing_raw.content | default('') | b64decode).splitlines()
              | select('search', 'pvecfg-receive [a-z0-9-]+" ssh-ed25519 ')
              | map('regex_replace', '^.*pvecfg-receive ([a-z0-9-]+)" (ssh-ed25519 [A-Za-z0-9+/=]+).*$', '\1 \2')
              | map('split', ' ', 1) | list) }}

- name: Choose each node's key (this run's, else the one already authorized)
  ansible.builtin.set_fact:
    pve_config_receiver_clients: >-
      {{ (pve_config_receiver_clients | default([])) + [{
           'name': item,
           'key': (hostvars[item].pve_config_offsite_pubkey | default(pve_config_receiver_existing[item] | default(''))).split()[:2] | join(' ')
         }] }}
  loop: "{{ groups[pve_config_receiver_clients_group] | default([]) }}"
  # Only nodes that push here: enabled (recipients set) and targeting this host.
  # A node switched off or pointed elsewhere is neither authorized nor expected,
  # so it cannot cause daily "never pushed" alerts on a receiver it never uses.
  when:
    - (hostvars[item].pve_config_offsite_recipients | default([])) | length > 0
    - (hostvars[item].pve_config_offsite_target | default('')) == inventory_hostname
    - hostvars[item].pve_config_offsite_pubkey is defined or item in pve_config_receiver_existing

- name: Refuse anything but a single ssh-ed25519 key per node
  ansible.builtin.assert:
    that:
      - item.name is match('^[a-z0-9][a-z0-9-]{0,62}$')
      - item.key is match('^ssh-ed25519 [A-Za-z0-9+/]+={0,2}$')
    fail_msg: "Push key for {{ item.name }} is not a single ssh-ed25519 key; refusing to authorize it."
    quiet: true
  loop: "{{ pve_config_receiver_clients | default([]) }}"
  loop_control:
    label: "{{ item.name }}"

- name: Publish this host's ssh host key for the clients to pin
  block:
    - name: Read the ed25519 host key
      ansible.builtin.slurp:
        src: /etc/ssh/ssh_host_ed25519_key.pub
      register: pve_config_receiver_hostkey_raw

    - name: Publish it as a fact
      ansible.builtin.set_fact:
        pve_config_receiver_hostkey: "{{ (pve_config_receiver_hostkey_raw.content | b64decode).split()[:2] | join(' ') }}"

- name: Install the receiver
  when:
    - pve_config_receiver_enabled | bool
    - (pve_config_receiver_clients | default([])) | length > 0
  vars:
    pve_config_receiver_nodes: "{{ pve_config_receiver_clients | map(attribute='name') | list }}"
  block:
    - name: Require Apprise for the stale-copy alert
      ansible.builtin.stat:
        path: "{{ pve_config_receiver_apprise_config }}"
      register: pve_config_receiver_apprise

    - name: Refuse to install without an alert path
      ansible.builtin.assert:
        that: pve_config_receiver_apprise.stat.exists
        fail_msg: >-
          {{ pve_config_receiver_apprise_config }} is missing, so a node that stops
          pushing would go unnoticed. Apply roles/smart_monitoring to this host first.
        quiet: true

    - name: Create the push-only user (locked password, keys only)
      ansible.builtin.user:
        name: "{{ pve_config_receiver_user }}"
        system: true
        shell: /bin/sh
        home: "/var/lib/{{ pve_config_receiver_user }}"
        create_home: true
        password: "!"
        password_lock: true

    # Root-owned and traverse-only for pvecfg: it can write in its node
    # directories but never remove or rename them.
    - name: Create the storage root
      ansible.builtin.file:
        path: "{{ pve_config_receiver_root }}"
        state: directory
        owner: root
        group: "{{ pve_config_receiver_user }}"
        mode: "0710"

    - name: Create a directory per node
      ansible.builtin.file:
        path: "{{ pve_config_receiver_root }}/{{ item }}"
        state: directory
        owner: "{{ pve_config_receiver_user }}"
        group: "{{ pve_config_receiver_user }}"
        mode: "0700"
      loop: "{{ pve_config_receiver_nodes }}"

    # mtime marks when a node was first expected, for the never-pushed grace.
    - name: Mark when each node was first expected
      ansible.builtin.file:
        path: "{{ pve_config_receiver_root }}/{{ item }}/.created"
        state: touch
        owner: "{{ pve_config_receiver_user }}"
        group: "{{ pve_config_receiver_user }}"
        mode: "0600"
        modification_time: preserve
        access_time: preserve
      loop: "{{ pve_config_receiver_nodes }}"

    - name: Deploy the receive and prune scripts
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - {src: pvecfg-receive.sh.j2, dest: /usr/local/sbin/pvecfg-receive, mode: "0755"}
        - {src: pvecfg-prune.py.j2, dest: /usr/local/sbin/pvecfg-prune, mode: "0750"}
      loop_control:
        label: "{{ item.dest }}"

    - name: Create the root-owned authorized keys directory
      ansible.builtin.file:
        path: /etc/ssh/authorized_keys.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy the forced-command keys
      ansible.builtin.template:
        src: authorized_keys.j2
        dest: "/etc/ssh/authorized_keys.d/{{ pve_config_receiver_user }}"
        owner: root
        group: root
        mode: "0644"

    # sshd -t checks the whole config including this drop-in; a broken file is
    # removed again before anything reloads, so ssh access is never at risk.
    - name: Lock down sshd for the push user
      block:
        - name: Deploy the sshd drop-in
          ansible.builtin.template:
            src: sshd-pvecfg.conf.j2
            dest: /etc/ssh/sshd_config.d/99-pvecfg.conf
            owner: root
            group: root
            mode: "0644"
          register: pve_config_receiver_sshd

        - name: Validate the full sshd config
          ansible.builtin.command: /usr/sbin/sshd -t
          changed_when: false
          when: pve_config_receiver_sshd.changed and not ansible_check_mode
      rescue:
        - name: Remove the drop-in that failed validation
          ansible.builtin.file:
            path: /etc/ssh/sshd_config.d/99-pvecfg.conf
            state: absent

        - name: Stop here
          ansible.builtin.fail:
            msg: sshd -t rejected 99-pvecfg.conf; removed it, sshd was not reloaded.

    - name: Reload sshd
      ansible.builtin.systemd:
        name: ssh
        state: reloaded
      when:
        - pve_config_receiver_sshd.changed
        - not ansible_check_mode

    - name: Deploy prune units
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - pvecfg-prune.service
        - pvecfg-prune.timer
        - pvecfg-prune-failure.service
      register: pve_config_receiver_units

    - name: Enable the daily prune timer
      ansible.builtin.systemd:
        name: pvecfg-prune.timer
        state: started
        enabled: true
        daemon_reload: "{{ pve_config_receiver_units.changed }}"
      when: not ansible_check_mode

# Off (no client has a recipient): stop accepting pushes and stop the stale-copy
# checks, so a switched-off feature does not alert daily forever. Stored copies,
# the user and the scripts are left in place.
- name: Disable the receiver
  when: not (pve_config_receiver_enabled | bool)
  block:
    - name: Stop accepting pushes
      ansible.builtin.file:
        path: "/etc/ssh/authorized_keys.d/{{ pve_config_receiver_user }}"
        state: absent

    - name: Stop the daily prune and stale-copy check
      ansible.builtin.systemd:
        name: pvecfg-prune.timer
        state: stopped
        enabled: false
      failed_when: false
