---
- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ mem0_compose_dir }}/docker-compose.yml"
    mode: "0600"
  no_log: true
  notify: Restart mem0 stack

- name: Deploy mem0-mcp Dockerfile
  ansible.builtin.template:
    src: Dockerfile.mem0-mcp.j2
    dest: "{{ mem0_compose_dir }}/Dockerfile.mem0-mcp"
    mode: "0644"
  no_log: true
  notify: Restart mem0 stack
  when: mem0_mcp_enabled
