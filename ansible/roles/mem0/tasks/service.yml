---
- name: Pull container images
  ansible.builtin.command:
    cmd: "docker compose pull --ignore-pull-failures"
    chdir: "{{ mem0_compose_dir }}"
  register: mem0_pull_result
  changed_when: "'Pulling' in mem0_pull_result.stdout or 'Downloading' in mem0_pull_result.stderr"
  check_mode: false

- name: Start mem0 stack
  ansible.builtin.command:
    cmd: "docker compose up -d"
    chdir: "{{ mem0_compose_dir }}"
  register: mem0_up_result
  changed_when: "'Creating' in mem0_up_result.stdout or 'Starting' in mem0_up_result.stdout"
  check_mode: false

- name: Wait for Ollama to be ready
  ansible.builtin.uri:
    url: "http://localhost:{{ mem0_ollama_port }}/api/tags"
    method: GET
  register: mem0_ollama_ready
  until: mem0_ollama_ready.status == 200
  retries: 30
  delay: 5
  check_mode: false

- name: Pull Ollama models
  ansible.builtin.command:
    cmd: "docker exec mem0-ollama ollama pull {{ item }}"
  loop: "{{ mem0_ollama_models }}"
  register: mem0_model_pull
  changed_when: "'pulling' in mem0_model_pull.stdout"
  check_mode: false

- name: Verify Ollama has models loaded
  ansible.builtin.uri:
    url: "http://localhost:{{ mem0_ollama_port }}/api/tags"
    method: GET
    return_content: true
  register: mem0_ollama_tags
  failed_when: "'bge-m3' not in mem0_ollama_tags.content"
  check_mode: false

- name: Wait for OpenMemory to be healthy
  ansible.builtin.uri:
    url: "http://localhost:{{ mem0_openmemory_port }}/health"
    method: GET
  register: mem0_openmemory_health
  until: mem0_openmemory_health.status == 200
  retries: 20
  delay: 5
  check_mode: false

# Open WebUI only reads OLLAMA_BASE_URLS on first start; afterwards the value
# stored in its database wins. Retried because a fresh container may still be
# creating its database.
- name: Sync Open WebUI's Ollama servers with mem0_openwebui_ollama_urls
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -i
      - mem0-openwebui
      - python3
      - "-"
      - ollama.base_urls
      - "{{ mem0_openwebui_ollama_urls | to_json }}"
    stdin: "{{ lookup('ansible.builtin.file', 'openwebui_set_config.py') }}"
  register: mem0_openwebui_urls
  until: mem0_openwebui_urls.rc == 0
  retries: 10
  delay: 6
  changed_when: mem0_openwebui_urls.stdout == 'changed'
  when: mem0_openwebui_enabled

- name: Restart Open WebUI to load its new Ollama servers  # noqa: no-handler
  ansible.builtin.command: docker restart mem0-openwebui
  changed_when: true
  when:
    - mem0_openwebui_enabled
    - mem0_openwebui_urls.changed | default(false)

- name: Check if Tailscale Service is already registered
  ansible.builtin.shell: set -o pipefail; tailscale serve status --json | jq -e '.Services["{{ mem0_tailscale_service }}"]'
  args:
    executable: /bin/bash
  register: mem0_tailscale_svc_status
  changed_when: false
  failed_when: false
  when: mem0_tailscale_service | length > 0

- name: Register Tailscale Service for OpenMemory  # noqa: no-handler
  ansible.builtin.command: >
    tailscale serve
    --service={{ mem0_tailscale_service }}
    --bg --https=443 127.0.0.1:{{ mem0_openmemory_port }}
  when:
    - mem0_tailscale_service | length > 0
    - mem0_tailscale_svc_status.rc != 0
  changed_when: true

- name: Deploy auto-update cron
  ansible.builtin.cron:
    name: "mem0-auto-update"
    weekday: "{{ mem0_auto_update_weekday }}"
    hour: "{{ mem0_auto_update_hour }}"
    minute: "{{ mem0_auto_update_minute }}"
    job: >-
      cd {{ mem0_compose_dir }} &&
      docker compose pull --quiet &&
      docker compose up -d &&
      docker image prune -a -f
      >> /var/log/mem0-update.log 2>&1
  when: mem0_auto_update_enabled
