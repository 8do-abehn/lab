---
- name: Install Docker prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true

- name: Add Docker GPG key
  ansible.builtin.apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Detect OS codename
  ansible.builtin.command: lsb_release -cs
  register: mem0_os_codename
  changed_when: false
  check_mode: false

- name: Add Docker repository
  ansible.builtin.apt_repository:
    repo: "deb https://download.docker.com/linux/ubuntu {{ mem0_os_codename.stdout }} stable"
    state: present

- name: Install Docker CE and Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Ensure Docker service is running
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Create mem0 compose directory
  ansible.builtin.file:
    path: "{{ mem0_compose_dir }}"
    state: directory
    mode: "0755"
