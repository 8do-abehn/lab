---
# mem0 stack defaults

# Docker compose project directory
mem0_compose_dir: /opt/mem0

# Container images
mem0_ollama_image: "docker.io/ollama/ollama:latest"
mem0_openwebui_image: "ghcr.io/open-webui/open-webui:main"

# Ports (bound to 0.0.0.0 for Tailscale access)
mem0_ollama_port: 11434
mem0_openmemory_port: 8090
mem0_openwebui_port: 3000

# Ollama models pulled on every deploy into the CPU Ollama on mem01. Chat
# models (qwen3:8b, llama3.1:8b) run on the GPU Ollama on ollama01
# (svc:ollama), which Open WebUI also uses.
mem0_ollama_models:
  - bge-m3

# OpenMemory embeddings (#625). "deep" embeds every memory with a real model;
# "hybrid" (the old setting) used only hash-based synthetic vectors and never
# called Ollama.
#
# The model and dimension are a pair, and vectors do not record which model
# made them: OpenMemory truncates or zero-pads to OM_VEC_DIM and compares
# whatever is stored. Changing either one is a migration, not an edit. Export
# the memories, wipe them and add them back, or recall silently degrades.
mem0_openmemory_tier: deep
mem0_openmemory_embed_model: "bge-m3:567m"
mem0_openmemory_vec_dim: 1024
# Where that model runs. The mem01 CPU takes ~4 s per embedding and deep makes
# about five per memory; host_vars point mem01 at svc:ollama (GPU, ~0.12 s).
mem0_openmemory_ollama_url: http://ollama:11434
mem0_openmemory_dns: "{{ mem0_openwebui_dns }}"

# OpenMemory silently falls back to synthetic vectors when its Ollama is
# unreachable (the fallback cannot be disabled). An hourly check looks for
# that in the container log, logs it to the journal and notifies through
# /etc/apprise.yml when the host has one.
mem0_openmemory_fallback_check_enabled: true

# Tailscale service for OpenMemory
mem0_tailscale_service: "svc:mem0"

# Feature flags
mem0_openwebui_enabled: true

# Ollama servers Open WebUI uses. The first also serves RAG embeddings.
# Kept in sync with the setting stored in Open WebUI's database (service.yml).
mem0_openwebui_ollama_urls:
  - http://ollama:11434

# Resolvers for the Open WebUI container. Empty uses Docker's default, which
# cannot resolve tailnet names on a host running --accept-dns=false.
mem0_openwebui_dns: []

# Auto-update: weekly cron to pull latest images and prune old ones
mem0_auto_update_enabled: true
mem0_auto_update_weekday: "0"
mem0_auto_update_hour: "4"
mem0_auto_update_minute: "30"
