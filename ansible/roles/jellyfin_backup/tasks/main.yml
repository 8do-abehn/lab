---
# Jellyfin backup role - manages rclone backup to Backblaze B2

- name: Install rclone
  ansible.builtin.apt:
    name: rclone
    state: present
    update_cache: yes
    cache_valid_time: 3600

- name: Create rclone config directory
  ansible.builtin.file:
    path: /root/.config/rclone
    state: directory
    mode: '0700'
    owner: root
    group: root

- name: Deploy rclone config
  ansible.builtin.template:
    src: rclone.conf.j2
    dest: /root/.config/rclone/rclone.conf
    mode: '0600'
    owner: root
    group: root
  no_log: true

- name: Deploy backup script
  ansible.builtin.template:
    src: mnt_library_backup.sh.j2
    dest: /usr/local/bin/mnt_library_backup.sh
    mode: '0755'
    owner: root
    group: root

- name: Remove legacy cron job (not managed by ansible)
  ansible.builtin.lineinfile:
    path: /var/spool/cron/crontabs/root
    regexp: '^0 0 \* \* \* /usr/local/bin/mnt_library_backup\.sh$'
    state: absent
  failed_when: false

- name: Setup backup cron job
  ansible.builtin.cron:
    name: "Jellyfin library backup to B2"
    minute: "0"
    hour: "0"
    job: "/usr/local/bin/mnt_library_backup.sh"
    user: root
    state: present

- name: Deploy logrotate config
  ansible.builtin.template:
    src: logrotate-mnt-library-backup.j2
    dest: /etc/logrotate.d/mnt-library-backup
    mode: '0644'
    owner: root
    group: root
