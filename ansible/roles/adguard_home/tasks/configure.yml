---
- name: Check if AdGuard Home config exists (setup wizard creates it)
  ansible.builtin.stat:
    path: /opt/AdGuardHome/AdGuardHome.yaml
  register: adguard_home_config

- name: Deploy initial AdGuard Home configuration
  ansible.builtin.template:
    src: AdGuardHome.yaml.j2
    dest: /opt/AdGuardHome/AdGuardHome.yaml
    owner: root
    group: root
    mode: "0600"
  when: not adguard_home_config.stat.exists
  notify: Restart AdGuard Home

- name: Ensure reconciliation dependencies available
  ansible.builtin.package:
    name:
      - python3-yaml
      - python3-bcrypt
    state: present

- name: Install reconciliation helpers
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/opt/AdGuardHome/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - manage_rewrites.py
    - manage_blocked_services.py
    - manage_users.py
    - manage_settings.py

- name: Reconcile AdGuard Home web/DNS bind settings
  ansible.builtin.command: /opt/AdGuardHome/manage_settings.py
  args:
    stdin: >-
      {{ {'http_address': adguard_home_web_bind ~ ':' ~ adguard_home_web_port,
          'dns_bind_hosts': [adguard_home_dns_bind],
          'dns_port': adguard_home_dns_port} | to_json }}
  register: settings_result
  changed_when: settings_result.stdout == "CHANGED"
  notify: Restart AdGuard Home

- name: Reconcile AdGuard Home DNS rewrites
  ansible.builtin.command: /opt/AdGuardHome/manage_rewrites.py
  args:
    stdin: "{{ adguard_home_rewrites | to_json }}"
  register: rewrite_result
  changed_when: rewrite_result.stdout == "CHANGED"
  notify: Restart AdGuard Home

- name: Reconcile AdGuard Home blocked services
  ansible.builtin.command: /opt/AdGuardHome/manage_blocked_services.py
  args:
    stdin: "{{ adguard_home_blocked_services | to_json }}"
  register: blocked_services_result
  changed_when: blocked_services_result.stdout == "CHANGED"
  notify: Restart AdGuard Home

- name: Reconcile AdGuard Home users
  ansible.builtin.command: /opt/AdGuardHome/manage_users.py
  args:
    stdin: "{{ [{'name': adguard_home_username, 'password': adguard_home_password}] | to_json }}"
  register: users_result
  changed_when: users_result.stdout == "CHANGED"
  no_log: true
  notify: Restart AdGuard Home
  when: adguard_home_password != ""
