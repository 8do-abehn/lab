---
# Datapacks ship from this role's files/ and are copied into each world by
# the itzg image's DATAPACKS env on start. Copied before the compose file so
# a brand new world already has them on its first boot.
- name: Copy datapacks
  ansible.builtin.copy:
    src: "datapacks/{{ item.1 }}/"
    dest: "{{ minecraft_compose_dir }}/datapacks/{{ item.1 }}/"
    mode: "0644"
    directory_mode: "0755"
  loop: "{{ minecraft_servers | subelements('datapacks', skip_missing=true) }}"
  loop_control:
    label: "{{ item.0.name }}: {{ item.1 }}"

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ minecraft_compose_dir }}/docker-compose.yml"
    mode: "0600"
  no_log: true
  notify: Restart minecraft stack

- name: Deploy auto-update cron
  ansible.builtin.cron:
    name: "minecraft-auto-update"
    weekday: "{{ minecraft_auto_update_weekday }}"
    hour: "{{ minecraft_auto_update_hour }}"
    minute: "{{ minecraft_auto_update_minute }}"
    job: >-
      cd {{ minecraft_compose_dir }} &&
      docker compose pull --quiet &&
      docker compose up -d --remove-orphans &&
      docker image prune -f
      >> /var/log/minecraft-update.log 2>&1
  when: minecraft_auto_update_enabled
