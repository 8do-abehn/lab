---
# Pull and up stay out of check mode: they act on the live host, and CI runs
# site.yml --check on every PR. With check_mode: false a freshly published
# image got pulled and the running containers recreated mid-game (#685).
- name: Pull container images
  ansible.builtin.command:
    cmd: "docker compose pull --ignore-pull-failures"
    chdir: "{{ minecraft_compose_dir }}"
  register: minecraft_pull_result
  changed_when: "'Pulling' in minecraft_pull_result.stdout or 'Downloading' in minecraft_pull_result.stderr"

- name: Start minecraft stack
  ansible.builtin.command:
    cmd: "docker compose up -d"
    chdir: "{{ minecraft_compose_dir }}"
  register: minecraft_up_result
  # Compose v2 reports Created/Recreated/Started on stderr, so read both
  # streams or a recreation shows up as ok in the recap (#685).
  changed_when: "(minecraft_up_result.stdout ~ minecraft_up_result.stderr) is search('Creat|Start')"

- name: Wait for minecraft servers to be ready
  ansible.builtin.wait_for:
    port: "{{ item.port }}"
    host: 127.0.0.1
    timeout: 180
  loop: "{{ minecraft_servers }}"
  loop_control:
    label: "{{ item.name }}:{{ item.port }}"
  # Check mode never writes the compose file, so a newly added server has
  # no container to wait for and this would time out.
  when: not ansible_check_mode
