---
- name: Purge AppArmor (Docker in LXC workaround)
  ansible.builtin.apt:
    name: apparmor
    state: absent
    purge: true
  register: minecraft_apparmor_purge

- name: Restart Docker after AppArmor removal  # noqa: no-handler
  ansible.builtin.systemd:
    name: docker
    state: restarted
  when: minecraft_apparmor_purge is changed

- name: Create minecraft compose directory
  ansible.builtin.file:
    path: "{{ minecraft_compose_dir }}"
    state: directory
    mode: "0755"
