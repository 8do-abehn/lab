---
- name: Configure repositories
  ansible.builtin.include_tasks: repositories.yml
- name: Install default packages
  ansible.builtin.include_tasks: packages.yml
# import (not include) so the tag reaches the tasks inside: deploy with tags=disk-caps
- name: Cap journald and apt cache growth
  ansible.builtin.import_tasks: disk-caps.yml
  tags: disk-caps
# import so the tag reaches the tasks inside: deploy with tags=no-sleep
- name: Stop nodes from ever going to sleep
  ansible.builtin.import_tasks: no-sleep.yml
  tags: no-sleep
- name: Remove subscription nag
  ansible.builtin.include_tasks: subscription-nag.yml
- name: Configure GPU passthrough
  ansible.builtin.include_tasks: gpu-passthrough.yml
  when: proxmox_gpu_passthrough_enabled | default(false)
- name: Configure LVM thin pool autoextend
  ansible.builtin.include_tasks: lvm.yml
- name: Configure bridge VLAN allow-list
  ansible.builtin.include_tasks: network.yml
