---
# vendor-reset (#574): AMD Polaris cards (pve02's RX 570, passed to 704) have no FLR, so
# the only reset the kernel offers is a PCI bus reset. vfio does one on every VM start and
# it does not clear a wedged GPU: on 2026-11-06 three 704 boots in a row faulted straight
# after it, and only a PCI remove + rescan brought the card back. vendor-reset adds a
# device-specific reset (BACO for Polaris) that the kernel uses instead.
#
# Out-of-tree module, built by DKMS against the running kernel's headers. AUTOINSTALL in
# upstream's dkms.conf rebuilds it on kernel upgrades. proxmox-default-headers keeps the
# headers for future kernels arriving alongside them, without which that rebuild fails.
- name: Install vendor-reset build dependencies
  ansible.builtin.apt:
    name:
      - git
      - dkms
      - proxmox-default-headers
    state: present

# Pinned to a commit, not master: this is kernel code, and a pin bump should be a
# reviewed change. Built cleanly on 7.0.14-19-pve before it was pinned (2026-11-06).
- name: Check out vendor-reset at the pinned commit
  ansible.builtin.git:
    repo: https://github.com/gnif/vendor-reset.git
    dest: "/usr/src/vendor-reset-{{ proxmox_gpu_vendor_reset_dkms_version }}"
    version: "{{ proxmox_gpu_vendor_reset_commit }}"
  register: proxmox_vendor_reset_src

# Queried across all kernels, not with -k: "registered at all" and "installed for this
# kernel" are separate questions. A run that got through dkms add but failed the build
# leaves it registered with nothing installed, and re-adding it then errors out.
- name: Query DKMS state for vendor-reset
  ansible.builtin.command: "dkms status vendor-reset/{{ proxmox_gpu_vendor_reset_dkms_version }}"
  register: proxmox_vendor_reset_dkms
  changed_when: false
  check_mode: false

- name: Summarise DKMS state for vendor-reset
  ansible.builtin.set_fact:
    proxmox_vendor_reset_registered: "{{ proxmox_vendor_reset_dkms.stdout | length > 0 }}"
    proxmox_vendor_reset_installed: >-
      {{ proxmox_vendor_reset_dkms.stdout_lines
         | select('search', ', ' ~ ansible_kernel ~ ', ')
         | select('search', ': installed')
         | list | length > 0 }}

# DKMS keys builds by version, and the version in dkms.conf stays 0.1.1 across commits.
# Without this, a pin bump updates the source and DKMS keeps serving the old module.
- name: Drop the old vendor-reset build after a pin change
  ansible.builtin.command: "dkms remove vendor-reset/{{ proxmox_gpu_vendor_reset_dkms_version }} --all"
  changed_when: true
  when:
    - not ansible_check_mode
    - proxmox_vendor_reset_src.changed
    - proxmox_vendor_reset_registered | bool

- name: Register vendor-reset with DKMS
  ansible.builtin.command: "dkms add vendor-reset/{{ proxmox_gpu_vendor_reset_dkms_version }}"
  changed_when: true
  when:
    - not ansible_check_mode
    - proxmox_vendor_reset_src.changed or not proxmox_vendor_reset_registered | bool

- name: Build and install vendor-reset for the running kernel
  ansible.builtin.command: "dkms install vendor-reset/{{ proxmox_gpu_vendor_reset_dkms_version }} -k {{ ansible_kernel }}"
  changed_when: true
  when:
    - not ansible_check_mode
    - proxmox_vendor_reset_src.changed or not proxmox_vendor_reset_installed | bool

- name: Load vendor-reset at boot
  ansible.builtin.copy:
    content: "vendor-reset\n"
    dest: /etc/modules-load.d/vendor-reset.conf
    mode: "0644"

# Loading the module is not enough on 5.15+ kernels: each card's reset_method has to
# name device_specific, or the kernel keeps choosing the bus reset. Same rule upstream
# ships, scoped to the device IDs this host actually passes through.
- name: Select the vendor-reset method for the passed-through AMD GPUs
  ansible.builtin.template:
    src: 99-vendor-reset.rules.j2
    dest: /etc/udev/rules.d/99-vendor-reset.rules
    mode: "0644"

# The udev rule only fires on device add, i.e. at boot. These two tasks get the same
# result now, so the fix works without rebooting the node.
- name: Check whether vendor-reset is loaded
  ansible.builtin.stat:
    path: /sys/module/vendor_reset
  register: proxmox_vendor_reset_loaded

- name: Load vendor-reset now
  ansible.builtin.command: modprobe vendor-reset
  changed_when: true
  when:
    - not ansible_check_mode
    - not proxmox_vendor_reset_loaded.stat.exists

- name: Switch matching GPUs to the vendor-reset method now
  ansible.builtin.shell: |
    set -euo pipefail
    for id in {{ proxmox_gpu_vendor_reset_device_ids | join(' ') }}; do
      for dev in /sys/bus/pci/devices/*; do
        [ "$(cat "$dev/vendor")" = "0x1002" ] || continue
        [ "$(cat "$dev/device")" = "0x$id" ] || continue
        [ "$(cat "$dev/reset_method")" = "device_specific" ] && continue
        echo device_specific > "$dev/reset_method"
        echo "$dev"
      done
    done
  args:
    executable: /bin/bash
  register: proxmox_vendor_reset_method
  changed_when: proxmox_vendor_reset_method.stdout | length > 0
  when: not ansible_check_mode
