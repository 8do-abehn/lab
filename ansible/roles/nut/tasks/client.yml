---
- name: Find UPS server IP from detected hosts
  set_fact:
    dynamic_ups_server_ip: "{{ hostvars[item].ansible_host }}"
  when: hostvars[item].has_ups | default(false)
  loop: "{{ ansible_play_hosts }}"
  run_once: no

- name: Use dynamic or configured UPS server IP
  set_fact:
    ups_server_ip: "{{ dynamic_ups_server_ip | default(ups_server_ip) }}"

- name: Display UPS server being used
  debug:
    msg: "Configuring {{ inventory_hostname }} as NUT client, connecting to UPS server at {{ ups_server_ip }}"

- name: Set NUT mode to netclient
  lineinfile:
    path: /etc/nut/nut.conf
    regexp: '^MODE='
    line: 'MODE=netclient'
    create: yes

- name: Configure upsmon.conf for full network monitoring
  blockinfile:
    path: /etc/nut/upsmon.conf
    mode: '0600'
    create: yes
    marker: "# {mark} ANSIBLE MANAGED BLOCK"
    block: |
      MONITOR {{ ups_name }}@{{ ups_server_ip }} 1 {{ ups_user }} {{ ups_monitor_pass }} slave
      MINSUPPLIES 1
      SHUTDOWNCMD "/sbin/shutdown -h +0"
      POLLFREQ 5
      POLLFREQALERT 5
      HOSTSYNC 15
      DEADTIME 30
      POWERDOWNFLAG /etc/killpower
      RBWARNTIME 10
      NOCOMMWARNTIME 300
      FINALDELAY 5
  notify: Restart nut-monitor
  no_log: true

- name: Disable nut-server on clients
  systemd:
    name: nut-server
    state: stopped
    enabled: false
