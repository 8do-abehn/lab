---
- name: Require an explicit UPS server address
  ansible.builtin.assert:
    that:
      - ups_server_ip is defined
      - ups_server_ip | length > 0
    fail_msg: >-
      ups_server_ip is not set. Define it in group_vars for nut_netclients with
      the address of the host in the nut_server group, otherwise upsmon.conf is
      written with an empty MONITOR target and UPS shutdown never coordinates.
    quiet: true

- name: Display UPS server being used
  ansible.builtin.debug:
    msg: "Configuring {{ inventory_hostname }} as NUT client against {{ ups_server_ip }}"

- name: Set NUT mode to netclient
  ansible.builtin.lineinfile:
    path: /etc/nut/nut.conf
    regexp: "^MODE="
    line: "MODE=netclient"
    mode: "0640"
    create: true

- name: Configure upsmon.conf for full network monitoring
  ansible.builtin.blockinfile:
    path: /etc/nut/upsmon.conf
    mode: "0600"
    create: true
    marker: "# {mark} ANSIBLE MANAGED BLOCK"
    block: |
      MONITOR {{ ups_name }}@{{ ups_server_ip }} 1 {{ ups_user }} {{ ups_monitor_pass }} slave
      MINSUPPLIES 1
      SHUTDOWNCMD "/sbin/shutdown -h +0"
      POLLFREQ 5
      POLLFREQALERT 5
      HOSTSYNC 15
      DEADTIME 30
      POWERDOWNFLAG /etc/killpower
      RBWARNTIME 10
      NOCOMMWARNTIME 300
      FINALDELAY 5
  notify: Restart NUT client services
  no_log: true

- name: Disable nut-server on clients
  ansible.builtin.systemd:
    name: nut-server
    state: stopped
    enabled: false
  when: nut_units_present

- name: Disable nut-driver on clients (in case node was previously a server)
  ansible.builtin.systemd:
    name: "nut-driver@{{ ups_name }}"
    state: stopped
    enabled: false
  when: nut_units_present
  failed_when: false # Don't fail if service doesn't exist
