---
# The ignorelb block hands the low-battery decision to NUT instead of the UPS.
# See ups_ignore_lb and ups_charge_low in defaults/main.yml for the reasoning,
# and `man apcsmart` under "IGNORING LB STATE".
#
# override.battery.runtime.low = -1 disables the runtime half of NUT's LB test,
# because this unit's runtime estimate is the number that misfired in #492.
# battery.runtime is never below -1, so only the charge test remains.
- name: Configure ups.conf
  ansible.builtin.copy:
    dest: /etc/nut/ups.conf
    mode: "0640"
    content: |
      [{{ ups_name }}]
      driver = {{ ups_driver }}
      port = {{ ups_port }}
      desc = "{{ ups_desc }}"
      {% if ups_ignore_lb %}
      ignorelb
      override.battery.runtime.low = -1
      override.battery.charge.low = {{ ups_charge_low }}
      {% endif %}
  notify: Restart NUT services

# `upsmon master` on the admin user is what makes FSD work. upsmon on this host
# logs into upsd as ups_admin_user in master mode, and upsd authorises LOGIN,
# MASTER and FSD as three separate actions. The user previously had only
# `actions = SET` and `instcmds = ALL`, so FSD was denied and upsmon logged
# "FSD set on UPS myups@localhost failed: ERR ACCESS-DENIED". Without FSD the UPS
# is never told to drop the load, which is why pve01 came straight back up on
# 2026-10-02, and HOSTSYNC burned its full timer waiting on secondaries that
# could not be signalled. See #536 A2.
#
# `upsmon master` grants exactly login + master + fsd (server/user.c,
# set_upsmon_type). It does NOT grant SET, so the `actions = SET` line below is
# still required for upsrw. Multiple actions on one line would also work, but
# the keyword is the documented way and keeps us honest if NUT ever adds to the
# set a primary needs.
#
# Spelling: NUT 2.8.x prefers `primary`/`secondary` and keeps `master`/`slave`
# as accepted aliases. We use the old spelling because upsmon.conf below and
# client.yml both still say master/slave, and the three have to agree. Moving
# the whole role to primary/secondary is a separate change.
- name: Configure upsd.users
  ansible.builtin.copy:
    dest: /etc/nut/upsd.users
    mode: "0640" # Must be group-readable so nut-server can read it (runs as 'nut' user)
    owner: root
    group: nut
    content: |
      [{{ ups_admin_user }}]
        password = {{ ups_admin_pass }}
        upsmon master
        actions = SET
        instcmds = ALL

      [{{ ups_monitor_user }}]
        password = {{ ups_monitor_pass }}
        upsmon slave
  notify: Restart NUT services
  no_log: true

- name: Configure upsd.conf to listen on all interfaces
  ansible.builtin.copy:
    dest: /etc/nut/upsd.conf
    mode: "0640"
    content: |
      LISTEN 0.0.0.0
  notify: Restart NUT services

- name: Configure nut.conf to standalone
  ansible.builtin.copy:
    dest: /etc/nut/nut.conf
    mode: "0640"
    content: "MODE=standalone\n"
  notify: Restart NUT services

- name: Configure upsmon.conf completely
  ansible.builtin.copy:
    dest: /etc/nut/upsmon.conf
    mode: "0600"
    content: |
      MONITOR {{ ups_name }}@localhost 1 {{ ups_admin_user }} {{ ups_admin_pass }} master
      MINSUPPLIES 1
      SHUTDOWNCMD "/sbin/shutdown -h +0"
      POLLFREQ 5
      POLLFREQALERT 5
      HOSTSYNC 15
      DEADTIME 30
      POWERDOWNFLAG /etc/killpower
      RBWARNTIME 10
      NOCOMMWARNTIME 300
      FINALDELAY 5
  notify: Restart NUT services
  no_log: true

# Must happen before the driver starts, otherwise it cannot open the serial port.
- name: Add nut user to dialout group
  ansible.builtin.user:
    name: nut
    groups: dialout
    append: true

# client.yml disables this unit, so a host promoted from client to server needs it
# explicitly re-enabled. Without the driver, upsd runs but only serves stale data.
- name: Ensure the UPS driver is started and enabled
  ansible.builtin.systemd:
    name: "nut-driver@{{ ups_name }}"
    state: started
    enabled: true
  when: nut_units_present

- name: Ensure nut-server is started and enabled
  ansible.builtin.systemd:
    name: nut-server
    state: started
    enabled: true
  when: nut_units_present

- name: Ensure nut-monitor is started and enabled
  ansible.builtin.systemd:
    name: nut-monitor
    state: started
    enabled: true
  when: nut_units_present

# Any config change above must land before upsd is queried below.
- name: Apply pending NUT restarts
  ansible.builtin.meta: flush_handlers

# Both tasks below are skipped while ups_ignore_lb is true.
# override.battery.runtime.low marks the variable ST_FLAG_IMMUTABLE in the
# driver, so upsc reports the override (-1) rather than what NVRAM holds and
# upsd refuses the upsrw write. Left ungated they would report changed on every
# run and then fail.
- name: Read the current low-battery threshold
  ansible.builtin.command: upsc {{ ups_name }}@localhost battery.runtime.low
  register: ups_runtime_low
  when: not ups_ignore_lb
  changed_when: false
  failed_when: false
  # upsd takes a moment to answer after a restart.
  retries: 5
  delay: 3
  until: ups_runtime_low.rc | default(1) == 0

# Sets the UPS-side LB threshold to ups_lowbatt_runtime so upsmon has time to
# shut pve01 down and propagate FSD to the netclients. Written to UPS NVRAM, so
# it survives reboots and only needs setting once.
# Note: upsrw takes the password as an argument, so it is briefly visible in the
# process list on this host. no_log keeps it out of Ansible output.
- name: Raise the low-battery threshold on the UPS
  ansible.builtin.command: >-
    upsrw -s battery.runtime.low={{ ups_lowbatt_runtime }}
    -u {{ ups_admin_user }} -p {{ ups_admin_pass }}
    {{ ups_name }}@localhost
  when:
    - not ups_ignore_lb
    - ups_runtime_low.rc | default(1) == 0
    - (ups_runtime_low.stdout | default("") | trim | int) != (ups_lowbatt_runtime | int)
  changed_when: true
  no_log: true
