---
# NUT mode: determined by inventory group membership (nut_server group = server, all others = client)

# UPS device configuration (server mode)
ups_name: myups
ups_driver: apcsmart
# Overridden per host in inventory/group_vars/nut_server.yml (USB-to-serial adapter)
ups_port: /dev/ttyS0
ups_desc: "APC SMART-UPS 2200"

# NUT decides the low-battery condition, not the UPS.
#
# The role writes `ignorelb` plus two `override.*` settings into the [myups]
# section of ups.conf. The driver then discards the UPS's own LB flag and
# re-derives LB on every poll from
#   battery.charge < battery.charge.low  OR  battery.runtime < battery.runtime.low
# (drivers/dstate.c, status_set/status_commit). `override.battery.runtime.low`
# is pinned to -1, which can never be satisfied, so charge is the only trigger.
# See `man apcsmart`, section "IGNORING LB STATE".
#
# Why: on 2026-10-02 the UPS shut pve01 down while mains power was present the
# whole time. Its runtime estimate had decayed to battery.runtime.low, so it
# latched LB at 100% charge on line power, and the first momentary transfer to
# battery read as OB+LB and triggered an immediate shutdown. See #492 and #536.
# Deriving LB in NUT also means LB clears again on the next poll instead of
# latching in the UPS.
#
# This replaces the UPS-side threshold the role used to write to NVRAM with
# upsrw. `override.*` marks a variable ST_FLAG_IMMUTABLE (drivers/main.c,
# storeval), so the driver never publishes it RW and upsd answers any SET on it
# with ERR READONLY. The two mechanisms cannot coexist, so ups_lowbatt_runtime
# and both upsrw tasks are gone. The UPS's own NVRAM value still governs when
# the unit beeps; it no longer influences any shutdown decision.

# Battery charge percentage below which NUT declares LB.
#
# MUST be an integer. drivers/dstate.c compares with strtol on both sides, so
# 50.5 would silently truncate to 50.
#
# PROVISIONAL, and it carries no guarantee of warning time. This value is
# derived from constraints, not from a measurement, and makes no safety claim.
# It is a stopgap until #487 runs a real discharge in a maintenance window.
#
# Why not the 15 from the apcsmart man page example: the pack was swapped to
# LiFePO4 on 01/24/25, but the UPS is from 2000 and derives battery.charge from
# pack voltage through a lead-acid capacity model. LiFePO4's discharge curve is
# flat, so the pack holds roughly the same voltage across most of its usable
# capacity and then falls off a cliff. Read through a lead-acid curve, that
# means battery.charge reads high for nearly the whole discharge and then
# collapses through its entire range in the last stretch.
#
# 50 is what the constraints leave:
#  - The lowest battery.charge ever observed on line power is 84 (#536 records
#    100, 93 and 84-85 readings taken minutes apart on mains). 50 leaves 34
#    points of headroom, so it cannot recreate the false-LB latch that A1
#    exists to remove.
#  - It is strictly better than 15 under every model of the distorted curve
#    considered, because the collapse passes through 50 first.
#
# What it does NOT do is promise any particular number of seconds between LB
# and a flat pack. Nobody knows that number yet. Revisit the moment #487
# produces a measured discharge curve.
ups_charge_low: 50

# User configuration
ups_admin_user: admin
ups_monitor_user: monuser
ups_admin_pass: "{{ vault_ups_admin_pass }}"
ups_monitor_pass: "{{ vault_ups_monitor_pass }}"

# Client configuration
# No default server: set ups_server_ip in group_vars (see inventory/group_vars/nut.yml)
# so a missing value fails loudly in client.yml instead of writing an empty MONITOR line.
ups_server_ip: ""
ups_user: monuser
