---
# NUT mode: determined by inventory group membership (nut_server group = server, all others = client)

# UPS device configuration (server mode)
ups_name: myups
ups_driver: apcsmart
# Overridden per host in inventory/group_vars/nut_server.yml (USB-to-serial adapter)
ups_port: /dev/ttyS0
ups_desc: "APC SMART-UPS 2200"

# Low-battery threshold, in seconds of runtime remaining. The UPS ships at 120,
# which is not enough for three Proxmox nodes to stop their guests and quiesce
# Ceph before the batteries go (measured runtime is ~7 min, see UPS-SHUTDOWN.md).
# The apcsmart driver only accepts 120, 300, 420 and 600.
ups_lowbatt_runtime: 300

# User configuration
ups_admin_user: admin
ups_monitor_user: monuser
ups_admin_pass: "{{ vault_ups_admin_pass }}"
ups_monitor_pass: "{{ vault_ups_monitor_pass }}"

# Client configuration
# No default server: set ups_server_ip in group_vars (see inventory/group_vars/nut.yml)
# so a missing value fails loudly in client.yml instead of writing an empty MONITOR line.
ups_server_ip: ""
ups_user: monuser
