---
- name: Restart NUT services
  systemd:
    name: "{{ item }}"
    state: restarted
    enabled: true
  loop:
    - nut-server
    - nut-monitor
  when: nut_mode == 'server'

- name: Restart NUT client services
  systemd:
    name: nut-monitor
    state: restarted
    enabled: true
  when: nut_mode == 'client'
