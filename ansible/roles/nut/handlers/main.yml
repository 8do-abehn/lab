---
- name: Restart NUT services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: restarted
    enabled: true
  loop:
    # Driver first: upsd has nothing to serve until the driver is talking to the UPS.
    - "nut-driver@{{ ups_name }}"
    - nut-server
    - nut-monitor
  when: nut_mode == 'server' and nut_units_present

- name: Restart NUT client services
  ansible.builtin.systemd:
    name: nut-monitor
    state: restarted
    enabled: true
  when: nut_mode == 'client' and nut_units_present
