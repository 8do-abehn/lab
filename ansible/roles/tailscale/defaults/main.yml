---
# Tailscale authentication
tailscale_auth_key: "{{ vault_tailscale_auth_key | default('') }}"
tailscale_enable_ssh: true

# Subnet routing
tailscale_advertise_routes: []
# Use routes other subnet routers advertise. `tailscale up` refuses to run when a
# non-default setting is left off the command, so a host set up by hand with
# --accept-routes has to keep it here.
tailscale_accept_routes: false
# Set false to advertise routes without the role touching forwarding, iptables
# or iptables-persistent (sysctl.yml). For a Docker host: saving its iptables
# with netfilter-persistent would pin Docker's own rules into the boot config.
tailscale_manage_forwarding: true
tailscale_accept_dns: true

# Tailscale Service serve persistence (#396)
# Each entry renders a systemd oneshot unit that re-applies `tailscale serve`
# after tailscaled, so the config survives LXC restarts.
# Example:
#   tailscale_serve_services:
#     - name: jellyfin            # becomes svc:jellyfin
#       upstream: 127.0.0.1:8096  # required
#       https: 443                # optional, defaults to 443
tailscale_serve_services: []

# Service names this host used to serve and no longer should, e.g. after a
# rename. Their units are stopped, the serve config cleared and the unit file
# deleted. Entries can be dropped once every host has been deployed.
#   tailscale_serve_services_removed: [unifi]
tailscale_serve_services_removed: []

# Certificate settings
tailscale_setup_proxmox_certs: false
tailscale_cert_path: /etc/pve/local/pveproxy-ssl.pem
tailscale_key_path: /etc/pve/local/pveproxy-ssl.key
tailscale_cert_owner: root
tailscale_cert_group: www-data
tailscale_cert_mode: "0640"
tailscale_cert_renewal_days: 30
