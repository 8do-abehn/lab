---
- name: Detect OS distribution
  set_fact:
    tailscale_distro: "{{ 'ubuntu' if ansible_distribution == 'Ubuntu' else 'debian' }}"
    tailscale_codename: "{{ ansible_distribution_release }}"

- name: Ensure Tailscale GPG key is properly formatted
  shell: |
    curl -fsSL https://pkgs.tailscale.com/stable/{{ tailscale_distro }}/{{ tailscale_codename }}.gpg | \
    gpg --dearmor > /usr/share/keyrings/tailscale-archive-keyring.gpg.tmp && \
    mv /usr/share/keyrings/tailscale-archive-keyring.gpg.tmp /usr/share/keyrings/tailscale-archive-keyring.gpg
  args:
    creates: /usr/share/keyrings/tailscale-archive-keyring.gpg

- name: Add Tailscale repository
  copy:
    content: "deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/{{ tailscale_distro }} {{ tailscale_codename }} main\n"
    dest: /etc/apt/sources.list.d/tailscale.list
    owner: root
    group: root
    mode: '0644'

- name: Update apt cache after adding Tailscale repo
  apt:
    update_cache: yes
  changed_when: false

- name: Ensure required packages are installed
  apt:
    name:
      - tailscale
      - jq
      - openssl
    state: present
