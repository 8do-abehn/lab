---
- name: Ensure prerequisites for Tailscale repo setup
  ansible.builtin.apt:
    name:
      - curl
      - gnupg
    state: present
    update_cache: true

- name: Detect OS distribution
  ansible.builtin.set_fact:
    tailscale_distro: "{{ 'ubuntu' if ansible_facts['distribution'] == 'Ubuntu' else 'debian' }}"
    # Tailscale publishes a trixie repo now, so the host's own codename is used.
    # This used to map trixie -> bookworm, which on the trixie Proxmox nodes
    # rewrote a correct tailscale.list back to bookworm (#543).
    tailscale_codename: "{{ ansible_facts['distribution_release'] }}"

- name: Ensure Tailscale GPG key is properly formatted
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://pkgs.tailscale.com/stable/{{ tailscale_distro }}/{{ tailscale_codename }}.gpg | \
    gpg --dearmor > /usr/share/keyrings/tailscale-archive-keyring.gpg.tmp && \
    mv /usr/share/keyrings/tailscale-archive-keyring.gpg.tmp /usr/share/keyrings/tailscale-archive-keyring.gpg
  args:
    executable: /bin/bash
    creates: /usr/share/keyrings/tailscale-archive-keyring.gpg

- name: Add Tailscale repository
  ansible.builtin.copy:
    content: |
      deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/{{ tailscale_distro }} {{ tailscale_codename }} main
    dest: /etc/apt/sources.list.d/tailscale.list
    owner: root
    group: root
    mode: "0644"
  register: tailscale_repo_added

- name: Force apt cache update after adding Tailscale repo  # noqa: no-handler
  ansible.builtin.apt:
    update_cache: true
  when: tailscale_repo_added.changed
  changed_when: false

- name: Ensure apt cache is updated (routine)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  changed_when: false

- name: Ensure required packages are installed
  ansible.builtin.apt:
    name:
      - tailscale
      - jq
      - openssl
    state: present
