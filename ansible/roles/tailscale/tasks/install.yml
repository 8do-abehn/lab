---
- name: Ensure Tailscale GPG key is properly formatted
  shell: |
    curl -fsSL https://pkgs.tailscale.com/stable/debian/bookworm.gpg | \
    gpg --dearmor > /usr/share/keyrings/tailscale-archive-keyring.gpg.tmp && \
    mv /usr/share/keyrings/tailscale-archive-keyring.gpg.tmp /usr/share/keyrings/tailscale-archive-keyring.gpg
  args:
    creates: /usr/share/keyrings/tailscale-archive-keyring.gpg

- name: Add Tailscale repository
  copy:
    content: "deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/debian bookworm main\n"
    dest: /etc/apt/sources.list.d/tailscale.list
    owner: root
    group: root
    mode: '0644'

- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600
  changed_when: false

- name: Ensure required packages are installed
  apt:
    name:
      - tailscale
      - jq
      - openssl
    state: present
