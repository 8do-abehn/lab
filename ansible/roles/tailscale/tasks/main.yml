---
- name: Include sysctl tasks for subnet routing
  ansible.builtin.include_tasks: sysctl.yml
  when: tailscale_advertise_routes | default([]) | length > 0
- name: Include installation tasks
  ansible.builtin.include_tasks: install.yml
- name: Include authentication tasks
  ansible.builtin.include_tasks: auth.yml
- name: Include certificate tasks
  ansible.builtin.include_tasks: certs.yml
  when: tailscale_setup_proxmox_certs | default(false)
- name: Include Tailscale serve persistence tasks
  ansible.builtin.include_tasks: serve.yml
  when: tailscale_serve_services | length > 0
