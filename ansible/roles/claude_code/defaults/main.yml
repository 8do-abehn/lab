---
# Claude Code host (#575): an always-on place to run sessions that survive the
# Mac sleeping, steered from the phone with Remote Control.

# Claude Code refuses --dangerously-skip-permissions as root, and keeping the
# sessions off root limits what a bad command can do inside the container.
# No sudo on purpose; add packages through this role instead.
claude_user: claude

# gh comes from Ubuntu universe, which avoids a third-party apt repo.
claude_packages:
  # Lets become_user reach an unprivileged user if pipelining is ever off.
  - acl
  - curl
  - git
  - gh
  - jq
  - ripgrep
  - tmux

# The native installer puts the binary here and keeps it updated itself, so
# the role only makes sure it is installed and never pins a version.
claude_install_url: https://claude.ai/install.sh
