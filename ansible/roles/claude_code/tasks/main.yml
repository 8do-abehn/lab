---
# Claude Code host (#575). Login (`claude`, `gh auth login`) is done by hand on
# the box, so no tokens pass through ansible or the vault.

- name: Install tools for Claude Code sessions
  ansible.builtin.apt:
    name: "{{ claude_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the user Claude Code runs as
  ansible.builtin.user:
    name: "{{ claude_user }}"
    shell: /bin/bash
    create_home: true
  register: claude_user_result

# Mouse mode makes scrolling work from a phone SSH client, and the larger
# history keeps long session output reachable after a reattach.
- name: Configure tmux for the Claude user
  ansible.builtin.copy:
    content: |
      set -g mouse on
      set -g history-limit 50000
    dest: "/home/{{ claude_user }}/.tmux.conf"
    owner: "{{ claude_user }}"
    group: "{{ claude_user }}"
    mode: "0644"

# `creates` keeps this to a first install; after that the binary updates itself.
# Skipped in --check on a fresh host: the user isn't really created yet, so
# become_user fails with "unknown user".
- name: Install Claude Code with the native installer
  ansible.builtin.shell:
    cmd: set -o pipefail; curl -fsSL {{ claude_install_url }} | bash
    executable: /bin/bash
    creates: "/home/{{ claude_user }}/.local/bin/claude"
  become: true
  become_user: "{{ claude_user }}"
  when: not (ansible_check_mode and claude_user_result is changed)
